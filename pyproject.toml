[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "chomp"
dynamic = ["version"]
description = "minimal, Single-GPU-first Megalodon JAX pretraining harness."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "chomp contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: exact runtime pins define the environment covered by the resume and
# checkpoint suite. JAX CUDA plugins remain platform-specific; see README.
dependencies = [
  "jax==0.8.2",
  "jaxlib==0.8.2",
  "equinox==0.13.2",
  # Commit pin includes megalodon-jax 0.1.2 supports_segment_reset support.
  # The runtime version check remains a clear failure for editable installs.
  "megalodon-jax @ git+https://github.com/pszemraj/megalodon-jax.git@c0612735a1861dd5d72ef40937cd91b96dd8ac0d",
  "packaging==25.0",
  "optax @ git+https://github.com/google-deepmind/optax.git@141c8d5e3746540163da8c7edf5a0072369a27c8",
  "orbax-checkpoint==0.11.31",
  "PyYAML==6.0.3",
  "tqdm==4.67.1",
  "rich==14.2.0",
  "wandb==0.24.0",
  # Exact pin is deliberate: the window-shuffle resume-exactness fix
  # (_ResumeSafeWindowShuffleIterDataset in chomp.data.grain) patches grain's
  # private _WindowShuffleDatasetIterator._init flag. A construction-time
  # tripwire fails fast if the attribute vanishes, but any bump must re-verify
  # the workaround and the full interrupted-versus-continuous resume tests.
  "grain==0.2.15",
  # 5.0.0 is the first release with the remote-Parquet thread-shutdown fix
  # for apache/arrow#45214. Earlier releases can abort a successful run at
  # interpreter exit after a partially consumed streaming shard.
  "datasets==5.0.0",
  "transformers==4.57.3",
  "tokenizers==0.22.1",
  # CLI
  "click==8.3.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.11"]

[project.scripts]
chomp = "chomp.cli.main:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/chomp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chomp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (e.g., HF streaming state roundtrips)",
]
filterwarnings = [
  "ignore:Implicit conversion of an array to a dtype is deprecated.*:DeprecationWarning:chex._src.asserts",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/chomp/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "F722", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["chomp"]

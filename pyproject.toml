[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "chomp"
dynamic = ["version"]
description = "minimal, Single-GPU-first Megalodon JAX pretraining harness."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "chomp contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Stateful data/checkpoint dependencies stay pinned where their behavior is
# part of the harness. Other packages follow compatible release lines.
dependencies = [
  # Chomp is a Linux/NVIDIA training harness. JAX's CUDA extra installs the
  # matching jaxlib, CUDA plugin, and pip-managed CUDA 13 runtime libraries.
  "jax[cuda13]>=0.10.2,<0.11",
  "equinox>=0.13.8,<0.14",
  # 0.2.2 exposes exact FP32 loss sums and integer valid-target counts.
  "megalodon-jax>=0.2.2,<0.3",
  "optax>=0.2.8,<0.3",
  "orbax-checkpoint==0.11.31",
  "PyYAML>=6.0",
  "tqdm>=4.67",
  "rich>=13.0",
  "wandb>=0.16",
  # Exact pin is deliberate: the window-shuffle resume-exactness fix
  # (_ResumeSafeWindowShuffleIterDataset in chomp.data.grain) patches grain's
  # private _WindowShuffleDatasetIterator._init flag. There is no runtime
  # guard: if a newer grain drops the attribute the patch becomes a silent
  # no-op, so any bump must re-verify the workaround and the full
  # interrupted-versus-continuous resume tests.
  "grain==0.2.15",
  # 5.0.0 is the first release with the remote-Parquet thread-shutdown
  # workaround for apache/arrow#45214. Chomp also releases single-source
  # Arrow references after the advertised grace, then repeats that bounded
  # wait for native destructors initiated by the release.
  "datasets==5.0.0",
  "transformers>=4.57,<5",
  # CLI
  "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.14"]

[project.scripts]
chomp = "chomp.cli.main:cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/chomp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chomp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Implicit conversion of an array to a dtype is deprecated.*:DeprecationWarning:chex._src.asserts",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/chomp/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "F722", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["chomp"]

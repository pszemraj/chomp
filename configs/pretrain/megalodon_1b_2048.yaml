# Upper-capacity 974,619,648-parameter template at the authored 32,128-token vocabulary.
# It keeps released mega1.3B widths/projection ratios, but uses 18 rather than 24 layers
# and ties the LM head. One dry run fits a 32 GB RTX 5090; this is not a 24 GB fit claim.

model:
  backend: megalodon
  vocab_size: 32128
  model_dim: 2048
  num_layers: 18
  num_heads: 2
  z_dim: 512
  value_dim: 4096
  ffn_hidden_dim: 4864
  cema_ndim: 16
  norm_num_groups: 64
  norm_eps: 1.0e-5
  swiglu: false
  rescale_nffn: false
  scale_emb: false
  share_emb: true
  norm_affine: true
  dropout: 0.0
  attention_dropout: 0.0
  attention_dropout_mode: post_softmax
  hidden_dropout: 0.0
  chunk_size: 512
  attention_window: null
  rope_base: null
  init_mode: he
  use_checkpoint: true
  use_associative_segment_scan: true
  param_dtype: float32
  compute_dtype: bfloat16
  accum_dtype: float32
  attention_softmax_dtype: float32
  output_size: -1

data:
  backend: hf
  hf_dataset: HuggingFaceFW/finepdfs_edu_50BT-dclm_30BT-fineweb_edu_20BT-shuffled
  hf_name: default
  hf_split: train
  hf_revision: main
  hf_eval_split: null
  text_key: text
  shuffle_buffer_size: 200000
  shuffle_buffer_bytes: 536870912
  packing_mode: bin
  packing_buffer_docs: 256
  packing_strict_segments: true
  mask_boundary_loss: true
  train_on_eos: true
  window_shuffle_tokens: 8388608
  grain_prefetch: 2
  tokenizer:
    kind: hf
    hf_name_or_path: pszemraj/bytebpe-tokenizer-32k-mlm
    hf_use_fast: true
    hf_trust_remote_code: false
    add_eos: true
    max_doc_tokens: null

train:
  # About 19.65B maximum target positions (~20.2 per parameter before packing masks).
  steps: 600000
  batch_size: 1
  seq_len: 2048
  grad_accum: 16
  deterministic: false
  log_every: 25
  eval_every: 10000
  eval_failure_policy: fatal
  generate_every: 20000

optim:
  name: muon
  # This inherits the measured 200M optimizer policy; tune it before a costly long run.
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 6000
  min_lr_ratio: 0.1
  muon:
    lr_scale: 100.0
    consistent_rms: null

checkpoint:
  save_every: 10000
  max_to_keep: 2
  async_save: true
  resume_compat: strict

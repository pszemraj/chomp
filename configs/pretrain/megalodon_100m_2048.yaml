# Maintained 113,854,464-parameter single-GPU baseline at the authored 32,128-token vocabulary.
# This narrower shape is Chomp's measured baseline, not a released Megalodon preset.

model:
  backend: megalodon
  vocab_size: 32128
  model_dim: 768
  num_layers: 12
  num_heads: 2
  z_dim: 384
  value_dim: 768
  ffn_hidden_dim: 3072
  cema_ndim: 16
  norm_num_groups: 32
  norm_eps: 1.0e-5
  swiglu: false
  rescale_nffn: false
  scale_emb: false
  share_emb: true
  norm_affine: true
  dropout: 0.0
  attention_dropout: 0.0
  attention_dropout_mode: post_softmax
  hidden_dropout: 0.0
  # Fixed 512-token attention chunks bound the quadratic local-attention block.
  # attention_window is intentionally null because its training path is dense O(L^2).
  chunk_size: 512
  attention_window: null
  rope_base: null
  init_mode: he
  # Rematerialization is active because deterministic=false below, even with zero dropout.
  use_checkpoint: true
  use_associative_segment_scan: true
  param_dtype: float32
  compute_dtype: bfloat16
  accum_dtype: float32
  attention_softmax_dtype: float32
  output_size: -1

data:
  backend: hf
  hf_dataset: HuggingFaceFW/finepdfs_edu_50BT-dclm_30BT-fineweb_edu_20BT-shuffled
  hf_name: default
  hf_split: train
  hf_revision: main
  hf_eval_split: null
  text_key: text
  shuffle_buffer_size: 200000
  shuffle_buffer_bytes: 536870912
  packing_mode: bin
  packing_buffer_docs: 256
  packing_strict_segments: true
  mask_boundary_loss: true
  train_on_eos: true
  window_shuffle_tokens: 8388608
  grain_prefetch: 2
  tokenizer:
    kind: hf
    hf_name_or_path: pszemraj/bytebpe-tokenizer-32k-mlm
    hf_use_fast: true
    hf_trust_remote_code: false
    add_eos: true
    max_doc_tokens: null

train:
  steps: 100000
  batch_size: 2
  seq_len: 2048
  grad_accum: 8
  # false permits rematerialization; dropout remains zero, so this does not add randomness.
  deterministic: false
  log_every: 25
  eval_every: 2500
  eval_failure_policy: fatal
  generate_every: 5000

optim:
  name: muon
  # lr applies to Adam-owned tensors; eligible projections use lr * muon.lr_scale.
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 1000
  min_lr_ratio: 0.1
  muon:
    lr_scale: 100.0
    # null preserves the measured no-shape-scaling Muon policy.
    consistent_rms: null

checkpoint:
  save_every: 2500
  max_to_keep: 3
  async_save: true
  resume_compat: strict

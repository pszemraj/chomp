# Maintained 187,991,040-parameter recipe at the authored 32,128-token vocabulary.
# Layers and projection ratios match released mega200M; tying the LM head and using
# 512-token chunks are deliberate Chomp deviations for single-GPU training.

model:
  backend: megalodon
  vocab_size: 32128
  model_dim: 1024
  num_layers: 12
  num_heads: 1
  z_dim: 256
  value_dim: 2048
  ffn_hidden_dim: 2560
  cema_ndim: 16
  norm_num_groups: 32
  norm_eps: 1.0e-5
  swiglu: false
  rescale_nffn: false
  scale_emb: false
  share_emb: true
  norm_affine: true
  dropout: 0.0
  attention_dropout: 0.0
  attention_dropout_mode: post_softmax
  hidden_dropout: 0.0
  # Fixed chunks are the supported efficient path; dense attention_window training is rejected.
  chunk_size: 512
  attention_window: null
  rope_base: null
  init_mode: he
  use_checkpoint: true
  use_associative_segment_scan: true
  param_dtype: float32
  compute_dtype: bfloat16
  accum_dtype: float32
  attention_softmax_dtype: float32
  output_size: -1

data:
  backend: hf
  hf_dataset: HuggingFaceFW/finepdfs_edu_50BT-dclm_30BT-fineweb_edu_20BT-shuffled
  hf_name: default
  hf_split: train
  hf_revision: main
  hf_eval_split: null
  text_key: text
  shuffle_buffer_size: 200000
  shuffle_buffer_bytes: 536870912
  packing_mode: bin
  packing_buffer_docs: 256
  packing_strict_segments: true
  mask_boundary_loss: true
  train_on_eos: true
  window_shuffle_tokens: 8388608
  grain_prefetch: 2
  tokenizer:
    kind: hf
    hf_name_or_path: pszemraj/bytebpe-tokenizer-32k-mlm
    hf_use_fast: true
    hf_trust_remote_code: false
    add_eos: true
    max_doc_tokens: null

train:
  # About 4.09B maximum target positions (~21.8 per parameter before packing masks).
  steps: 125000
  batch_size: 2
  seq_len: 2048
  grad_accum: 8
  deterministic: false
  log_every: 25
  eval_every: 2500
  eval_failure_policy: fatal
  generate_every: 5000

optim:
  name: muon
  # lr applies to Adam-owned tensors; eligible projections use lr * muon.lr_scale.
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 1250
  min_lr_ratio: 0.1
  muon:
    lr_scale: 100.0
    consistent_rms: null

checkpoint:
  save_every: 2500
  max_to_keep: 3
  async_save: true
  resume_compat: strict

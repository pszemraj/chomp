# Offline CPU smoke test for config, packing, training, and checkpoint plumbing.

model:
  backend: dummy

data:
  backend: local_text
  local_text: |
    Hello from chomp. This local stream exercises tokenization and packing
    without downloading a dataset or tokenizer.
  packing_mode: bin
  packing_buffer_docs: 32
  window_shuffle_tokens: 0
  max_eval_samples: 0
  tokenizer:
    kind: byte
    add_eos: false

train:
  steps: 10
  batch_size: 2
  seq_len: 128
  grad_accum: 2
  deterministic: true
  allow_cpu: true
  log_every: 1
  eval_every: 0
  generate_every: 0

optim:
  warmup_steps: 2

checkpoint:
  save_every: 5
  async_save: false

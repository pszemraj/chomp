# Recommended 100M-parameter, 100k-step pretraining recipe on a shuffled 50% FinePDFs-Edu, 30% DCLM, and 20% FineWeb-Edu mixture.

model:
  backend: megalodon
  vocab_size: 32128
  model_dim: 768
  num_layers: 12
  num_heads: 2
  z_dim: 384
  value_dim: 768
  ffn_hidden_dim: 3072
  cema_ndim: 16
  chunk_size: 512
  use_checkpoint: true

data:
  backend: hf
  hf_dataset: HuggingFaceFW/finepdfs_edu_50BT-dclm_30BT-fineweb_edu_20BT-shuffled
  hf_name: default
  hf_split: train
  hf_revision: main
  hf_eval_split: null
  text_key: text
  shuffle_buffer_size: 200000
  shuffle_buffer_bytes: 536870912
  packing_mode: bin
  packing_buffer_docs: 256
  packing_strict_segments: true
  mask_boundary_loss: true
  window_shuffle_tokens: 8388608
  grain_prefetch: 2
  tokenizer:
    kind: hf
    hf_name_or_path: pszemraj/bytebpe-tokenizer-32k-mlm
    add_eos: true
    max_doc_tokens: null

train:
  steps: 100000
  batch_size: 2
  seq_len: 2048
  grad_accum: 8
  deterministic: false
  log_every: 25
  eval_every: 2500
  eval_failure_policy: fatal
  generate_every: 5000

optim:
  name: muon
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 1000
  min_lr_ratio: 0.1

checkpoint:
  save_every: 2500
  max_to_keep: 3
  async_save: true
  resume_compat: strict

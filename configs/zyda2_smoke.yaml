# Short GPU smoke test for the real Hugging Face streaming and tokenizer path.

model:
  backend: dummy

data:
  backend: hf
  hf_dataset: Zyphra/Zyda-2
  hf_name: sample-100BT
  hf_revision: bc389cd62969a275b2e3c3e11db826ba1918411a
  shuffle_buffer_size: 31
  shuffle_buffer_bytes: 8388608
  packing_mode: bin
  packing_buffer_docs: 32
  window_shuffle_tokens: 0
  grain_prefetch: 2
  max_eval_samples: 0
  tokenizer:
    kind: hf
    hf_name_or_path: pszemraj/bytebpe-tokenizer-32k-mlm
    add_eos: true

train:
  steps: 5
  batch_size: 2
  seq_len: 128
  grad_accum: 2
  deterministic: true
  log_every: 1
  eval_every: 0
  generate_every: 0

optim:
  warmup_steps: 1

checkpoint:
  enabled: false

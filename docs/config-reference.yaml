# chomp configuration reference
#
# Reference only: the typed placeholders below intentionally make this invalid as a chomp config. Runnable scenario configs live under configs/.
# Config files are YAML (any non-.json suffix) or JSON top-level mappings. The model/data/train/optim/checkpoint/logging/debug sections are mappings or null; every section and key is optional to author unless its comment says otherwise. Null schema sections and omitted values use the stated defaults.
# Unknown sections/keys, duplicate explicit YAML keys, unsupported choices, mistyped scalars, and invalid interactions fail before training. Standard YAML merge defaults may be overridden explicitly.
# Repeated `chomp train -o path=value` scalar overrides apply in order after variable resolution; the last value wins. Lists must be authored in the file. `--run-dir` then takes precedence over logging.run_dir and is validated as the final value.

# variables -- mapping[str, value]; default: {}. Values may be nested. A full `$variables.path` reference preserves type; `{$variables.path}` and `${variables.path}` interpolate into string values. Missing references and referenced cycles fail; unused cycles are not resolved.
variables: "<mapping[str, value]>"

# derived -- mapping; default: {}. Internal use only: resolved snapshots record the effective optimizer horizon and installed Megalodon-JAX identity here; authored values are ignored.
derived: "<mapping>"

# model -- mapping | null; default: {}. vocab_size, dropout, and token IDs feed shared execution; d_model is Dummy-only; share_emb also affects optimizer routing. Remaining fields execute only for Megalodon, though every authored closed-set/type constraint and the stated global output-size interactions are still validated.
# Megalodon preflight-hard resume fields are backend, vocab_size, model_dim, num_layers, z_dim, value_dim, ffn_hidden_dim, cema_ndim, swiglu, rescale_nffn, share_emb, norm_affine, output_size, and param_dtype. DummyLM hard fields are backend, vocab_size, and d_model; active share_emb is also hard when it changes Muon routing. Other active model values follow checkpoint.resume_compat, and any restored parameter/optimizer shape mismatch still fails.
model:
  # model.backend -- string; default: megalodon; one of: megalodon | dummy. `dummy` is a debug-only embedding-plus-linear causal LM using vocab_size, d_model, and dropout.
  backend: "<megalodon | dummy>"

  # model.vocab_size -- int; default: 256; > 0 and initially greater than every authored pad/BOS/EOS ID. Tokenizer setup later resolves round_up(max(authored value, tokenizer length), data.tokenizer.vocab_size_multiple) and validates the resolved IDs again; later rounding/auto-setting cannot rescue an initially invalid placeholder.
  vocab_size: "<int>"

  # model.d_model -- int; default: 128; > 0 when backend=dummy; ignored by Megalodon. Keep small for smoke tests. [Debug only]
  d_model: "<int>"

  # model.dropout -- float; default: 0.0; 0 <= value < 1. Shared model dropout; effective train.deterministic=true disables it, while nonzero contributes to the null deterministic default. Resume still compares the authored rate conservatively when deterministic execution disables it.
  dropout: "<float>"

  # model.model_dim -- int; default: 128; > 0 and divisible by model.num_heads and model.norm_num_groups. Megalodon hidden width.
  model_dim: "<int>"

  # model.num_layers -- int; default: 2; > 0. Megalodon layer count.
  num_layers: "<int>"

  # model.num_heads -- int; default: 1; > 0; must divide model.model_dim, model.z_dim, and model.value_dim, and z_dim / num_heads must be even for RoPE.
  num_heads: "<int>"

  # model.z_dim -- int; default: 64; > 0; divisible by model.num_heads with an even quotient. Megalodon query/key width.
  z_dim: "<int>"

  # model.value_dim -- int; default: 128; > 0 and divisible by model.num_heads. Megalodon value width.
  value_dim: "<int>"

  # model.ffn_hidden_dim -- int; default: 256; > 0. Feed-forward width; the maintained recipes use 1.59x to 2.67x model.model_dim. model.swiglu does NOT rescale this: the gate adds a third model_dim x ffn_hidden_dim matrix at the same width, so a param-matched gated recipe sets this to two-thirds of its non-gated value. See docs/training.md "Gated FFN and ffn_hidden_dim".
  ffn_hidden_dim: "<int>"

  # model.cema_ndim -- int; default: 16; > 0. CEMA components per channel; higher values add recurrent capacity and cost.
  cema_ndim: "<int>"

  # model.chunk_size -- int; default: 128; > 0, <= train.seq_len, and must divide train.seq_len. Supported efficient paper-faithful local-attention path for training; null train.generate_max_tokens resolves to this value + 16. Maintained pretrain recipes use 512 to bound each local quadratic block on one GPU.
  chunk_size: "<int>"

  # model.attention_window -- int | null; default: null, which keeps released chunk-local attention and cache capacity model.chunk_size. Positive values are inference-only: current noncached training is dense O(L²) attention with a window mask, so chomp train rejects them until an efficient upstream path exists. [Experimental]
  attention_window: "<int | null>"

  # model.norm_num_groups -- int; default: 32; > 0, smaller than model.model_dim, and must divide model.model_dim. Equality is unsupported because featurewise TimestepNorm needs an unconfigured learned prior.
  norm_num_groups: "<int>"

  # model.norm_eps -- float; default: 1e-5; > 0. Numerical-stability epsilon for Megalodon normalization.
  norm_eps: "<float>"

  # model.rope_base -- float | null; default: null, which Megalodon resolves to 10000; otherwise > 0. Change only as part of a deliberate context-scaling design.
  rope_base: "<float | null>"

  # model.swiglu -- bool; default: false. Enables SwiGLU in the Megalodon feed-forward network: silu(fc1(h)) * fc3(h) -> fc2 instead of silu(fc1(h)) -> fc2. All maintained pretrain recipes set it true, matching the upstream paper presets. Adds a third projection per layer, so it widens Muon routing and does not rescale model.ffn_hidden_dim -- see that field.
  swiglu: "<bool>"

  # model.rescale_nffn -- bool; default: false. Enables learned normalized-FFN residual rescaling; its scale uses Adam without weight decay.
  rescale_nffn: "<bool>"

  # model.scale_emb -- bool; default: false. Multiplies embeddings by sqrt(model.model_dim).
  scale_emb: "<bool>"

  # model.share_emb -- bool; default: true. Ties Megalodon input/output embeddings and requires output_size=-1 or vocab_size. DummyLM remains untied, but true opts its embedding into Muon when optim.muon.allow_tied_embed=true; changing that active routing always rejects resume.
  share_emb: "<bool>"

  # model.norm_affine -- bool; default: true. Enables learned affine parameters in RMSNorm and FFN LayerNorm; TimestepNorm remains affine.
  norm_affine: "<bool>"

  # model.attention_dropout -- float; default: 0.0; 0 <= value < 1. Megalodon-only; effective train.deterministic=true disables it, while nonzero contributes to the null deterministic default. Resume still compares the authored rate when disabled.
  attention_dropout: "<float>"

  # model.attention_dropout_mode -- string; default: post_softmax; one of: post_softmax | dropkey. Executed only when attention_dropout > 0, but resume still compares it at zero; keep post_softmax unless reproducing a deliberate DropKey run.
  attention_dropout_mode: "<post_softmax | dropkey>"

  # model.hidden_dropout -- float; default: 0.0; 0 <= value < 1. Megalodon-only; effective train.deterministic=true disables it, while nonzero contributes to the null deterministic default. Resume still compares the authored rate when disabled.
  hidden_dropout: "<float>"

  # model.pad_token_id -- int; default: 0; 0 <= value < authored model.vocab_size and, after HF auto-special replacement, the effective vocabulary. Equality with eos_token_id warns because external tooling may treat EOS as padding.
  pad_token_id: "<int>"

  # model.bos_token_id -- int; default: 1; 0 <= value < authored model.vocab_size and, after HF auto-special replacement, the effective vocabulary. Byte BOS insertion also requires it below data.tokenizer.byte_offset.
  bos_token_id: "<int>"

  # model.eos_token_id -- int; default: 2; 0 <= value < authored model.vocab_size and, after HF auto-special replacement, the effective vocabulary. Byte EOS insertion also requires it below data.tokenizer.byte_offset.
  eos_token_id: "<int>"

  # model.init_mode -- string; default: he; one of: gaussian | xavier | he | bert. Used only for fresh Megalodon initialization and resume-inert because restored parameters replace it. `he` is recommended.
  init_mode: "<gaussian | xavier | he | bert>"

  # model.use_checkpoint -- bool; default: false. Trades compute for activation memory. Effective train.deterministic=true disables it, making the value resume-inert in that context; otherwise it is active resume semantics. Maintained pretrain recipes set deterministic=false even with zero dropout so rematerialization remains active.
  use_checkpoint: "<bool>"

  # model.output_size -- int; default: -1, computed as effective vocab_size; otherwise > 0. With share_emb=true it must be -1 or model.vocab_size; an untied Megalodon training head may be larger, but periodic generation requires the effective output width to equal vocab_size. Keep -1 for causal-LM training and generation.
  output_size: "<-1 | positive int>"

  # model.use_associative_segment_scan -- bool; default: true. Used only for strict bin/multipack batches: true selects the parallel CEMA reset path; false uses a compact sequential forward carry, but compiled backward peak memory must still be measured. Active resume semantics under strict packed execution; inert otherwise. [Experimental]
  use_associative_segment_scan: "<bool>"

  # model.param_dtype -- string; default and only valid value: float32. Chomp has no FP32 master-parameter path, so lower-precision parameters and optimizer state are unsupported.
  param_dtype: "<float32>"

  # model.compute_dtype -- string; default: bfloat16; one of: float32 | bfloat16. BF16 is recommended on supported GPUs; FP16 is unsupported.
  compute_dtype: "<float32 | bfloat16>"

  # model.accum_dtype -- string; default and only valid value: float32. Controls model-internal attention/CEMA accumulation, not train.grad_accum.
  accum_dtype: "<float32>"

  # model.attention_softmax_dtype -- string; default: float32; one of: float32 | bfloat16. Keep FP32 for numerical stability; BF16 is an explicit lower-precision reduction.
  attention_softmax_dtype: "<float32 | bfloat16>"

# data -- mapping | null; default: {}. Source, order, packing, tokenizer, and objective fields participate in resume compatibility according to their active semantics.
data:
  # data.backend -- string; default: hf; one of: hf | local_text. `local_text` consumes literal inline text and is debug-only.
  backend: "<hf | local_text>"

  # data.hf_dataset -- string; default: Zyphra/Zyda-2; nonempty when backend=hf. When changing repositories, also replace the Zyda-specific default hf_name and verify the requested hf_revision.
  hf_dataset: "<nonempty string>"

  # data.hf_name -- string | null; default: sample-100BT; null lets Hugging Face Datasets select a repository's default configuration; ignored by local_text.
  hf_name: "<nonempty string | null>"

  # data.hf_split -- string; default: train; nonempty when backend=hf; ignored by local_text. Training split and source for a null-split content holdout.
  hf_split: "<nonempty string>"

  # data.hf_revision -- string | null; default: main. Any ref accepted by Hugging Face datasets is valid; null uses the repository default branch. A non-dry checkpointed run resolves a branch/tag/null ref to a concrete commit before use; disabled checkpointing and dry runs do not, so use a 40-hex commit there when immutable source identity matters.
  # This value belongs to hf_dataset: verify both together when changing sources.
  hf_revision: "<revision string | null>"

  # data.hf_requested_revision -- string | null; default: null. Internal snapshot field populated with the user-facing hf_revision before resolution; leave null in authored configs. Resume reuses a selected checkpoint's commit only when this request and hf_dataset still match.
  hf_requested_revision: "<revision string | null>"

  # data.hf_eval_split -- string | null; default: null; HF-only. With max_eval_samples>0, null content-hash partitions hf_split and excludes held-out content from training even when train.eval_every=0; an explicit nonempty split must differ from hf_split under that same gate.
  # Every HF eval source is consumed once in literal unshuffled order. Collection/schema failures never fall back to the training split; ignored by local_text.
  hf_eval_split: "<nonempty string | null>"

  # data.hf_eval_holdout_fraction -- float; default: 0.01; 0 < value < 1 for every HF config, even when inactive. Used only when hf_eval_split=null and max_eval_samples>0, where it partitions both train and eval content; ignored by local_text. 0.01 is the maintained choice.
  hf_eval_holdout_fraction: "<float>"

  # data.text_key -- string; default: text; nonempty when backend=hf; ignored by local_text. Every selected row must contain a string at this key; schema failures are not retried.
  text_key: "<nonempty string>"

  # data.shuffle -- bool; default: true; HF-only and training-only. Shuffles owned document windows; every eval source and generation prompt pool remains unshuffled. Packed-row shuffle is separate.
  shuffle: "<bool>"

  # data.shuffle_buffer_size -- int; default: 10000; > 0 when HF shuffle is active and resume-inert when shuffle=false. Document-count cap per owned window; maintained pretrain recipes use 200000 together with the byte cap for stronger mixing.
  shuffle_buffer_size: "<int>"

  # data.shuffle_buffer_bytes -- int; default: 536870912 (512 MiB); > 0 when HF shuffle is active and resume-inert when shuffle=false. UTF-8 payload cap per window; one oversized threshold-crossing document may exceed it.
  shuffle_buffer_bytes: "<int>"

  # data.seed -- int; default: 0; >= 0. Seeds active HF document and packed-row shuffles; model/dropout RNG uses train.seed.
  seed: "<int>"

  # data.repeat -- bool; default: true. Repeats training sources for step-based runs; false trains a padded usable tail and stops early at finite exhaustion.
  repeat: "<bool>"

  # data.local_text -- string; default: "Hello from chomp.\n"; nonempty when backend=local_text; ignored by HF. Literal text, not a path. For quick local smoke tests set max_eval_samples=0 and window_shuffle_tokens=0. [Debug only]
  local_text: "<nonempty string>"

  # data.packing_mode -- string; default: bin; one of: sequential | bin | multipack. Bin packing is the maintained real-training path; sequential preserves stream order and lets recurrent state cross documents, while mask_boundary_loss controls whether cross-document targets are trained.
  packing_mode: "<sequential | bin | multipack>"

  # data.packing_buffer_docs -- int; default: 256; > 0 in bin mode. Lookahead counts prepared seq_len chunks despite the legacy name. Training raises values below train.batch_size * train.grad_accum to that cycle size; evaluation raises values below train.batch_size. Equivalent effective values are resume-compatible.
  # This is a pack trigger, not a hard memory cap: one long document can enqueue more chunks before the cycle sorts the entire pending pool. Larger values trade startup memory for utilization.
  packing_buffer_docs: "<int>"

  # data.packing_max_docs_per_bin -- int | null; default: null (no cap); otherwise > 0; used only by bin/multipack. Caps prepared segments per row, not original source documents.
  packing_max_docs_per_bin: "<int | null>"

  # data.packing_group_docs -- int; default: 512; > 0 in multipack mode. Counts prepared seq_len chunks despite the legacy name; effective lookahead is max(this, cycle rows): train.batch_size * train.grad_accum for training and train.batch_size for evaluation. Equivalent effective values are resume-compatible.
  # It bounds candidates consumed per cycle, not the pending queue: one long document can enqueue beyond it. Larger groups increase memory and latency.
  packing_group_docs: "<int>"

  # data.packing_strict_segments -- bool; default: true; used only by bin/multipack and requires mask_boundary_loss=true. Keep true to isolate attention, RoPE, CEMA, and TimestepNorm; false deliberately leaks state across documents.
  packing_strict_segments: "<bool>"

  # data.mask_boundary_loss -- bool; default: true. Masks cross-document next-token targets in every packing mode and must remain true for strict bin/multipack; keep true for independent documents.
  mask_boundary_loss: "<bool>"

  # data.train_on_eos -- bool; default: true. False masks every label numerically equal to the effective EOS ID, including natural token-ID collisions; an all-masked batch fails before any optimizer/state change.
  train_on_eos: "<bool>"

  # data.window_shuffle_tokens -- int; default: 8388608; zero disables the training-only packed-row shuffle, otherwise >= train.seq_len * train.batch_size * train.grad_accum. Effective rows are floor(min(this // train.seq_len, data.window_shuffle_max_rows) / (train.batch_size * train.grad_accum)) * (train.batch_size * train.grad_accum); only effective rows and their seed are resume-significant.
  # This is a token-position count, not bytes; each retained row owns token and segment int32 arrays plus Python overhead. Keep enabled for ordered corpora; smoke configs disable it to avoid a full startup window.
  window_shuffle_tokens: "<int>"

  # data.window_shuffle_max_rows -- int; default: 4096; > 0 and, when window shuffling is enabled, >= train.batch_size * train.grad_accum. Row/object cap in the effective formula above; raw changes preserving effective rows are resume-compatible.
  window_shuffle_max_rows: "<int>"

  # data.grain_prefetch -- int; default: 2; >= 0; zero disables. Training-only assembled-batch queue that trades host memory for overlap; resume-inert because checkpoints pair parent state with the last delivered batch.
  grain_prefetch: "<int>"

  # data.max_eval_samples -- int; default: 1000; >= 0. With null hf_eval_split, zero disables eval data and returns the hash holdout to training, while any positive value partitions HF training regardless of train.eval_every. Eval collection itself additionally requires eval_every>0, a non-dry active run, and evaluation not already disabled.
  # Positive collection counts selected documents, not rows/tokens; a null-split holdout scans roughly value / hf_eval_holdout_fraction source rows. Documents are fully tokenized and retained until first eval, then packed batches are cached on host; max_doc_tokens does not cap that startup tokenization or interim storage. local_text repeats one text.
  max_eval_samples: "<int>"

  # data.eval_packing -- string; default: onedoc; one of: train | onedoc. Decides how eval rows are laid out, not which documents are selected. onedoc puts one document per padded row and pins its own FFD lookahead, so eval_loss measures the single-document condition generation runs under and stays comparable across runs whose training packing differs; train reuses packing_mode and its knobs instead.
  # Resume-significant: changing it changes what eval_loss means, so it follows checkpoint.resume_compat warn/strict semantics. onedoc costs eval wall clock proportional to the padding it adds (roughly 2x on long-document corpora) and is unaffected by packing_strict_segments, which has nothing to isolate at one segment per row.
  eval_packing: "<train | onedoc>"

  # data.tokenizer -- mapping | null; default: {}. Active tokenization semantics participate in resume compatibility. The saved effective class, package versions, files, and canary outputs contextually bind HF loading knobs. HF encoding itself adds no specials; add_bos/add_eos below own training/eval insertion.
  tokenizer:
    # data.tokenizer.kind -- string; default: hf; one of: byte | hf. Byte is an offline infrastructure tokenizer and must disable special insertion unless byte_offset reserves IDs for it.
    kind: "<byte | hf>"

    # data.tokenizer.hf_name_or_path -- string | null; default: pszemraj/bytebpe-tokenizer-32k-mlm; nonempty when kind=hf. Fresh runs snapshot these assets; resume loads only the snapshot and fails if it is missing.
    hf_name_or_path: "<repository ID | local path | null>"

    # data.tokenizer.hf_use_fast -- bool; default: true; HF-only. Keep true unless the selected tokenizer has no fast implementation. Resume loads the local snapshot with this request and strict mode rejects a changed effective implementation or output.
    hf_use_fast: "<bool>"

    # data.tokenizer.hf_trust_remote_code -- bool; default: false; HF-only. True executes custom tokenizer Python; enable only for reviewed, trusted code. Resume never contacts the configured source, but strict mode rejects a changed effective implementation or output.
    hf_trust_remote_code: "<bool>"

    # data.tokenizer.vocab_size_multiple -- int; default: 128; > 0. Effective vocabulary is round_up(max(model.vocab_size, tokenizer length), this value); raw changes preserving that effective vocabulary are resume-compatible. 128 is the maintained GPU alignment.
    vocab_size_multiple: "<int>"

    # data.tokenizer.auto_set_special_tokens -- bool; default: true; HF-only. Copies available pad/BOS/EOS IDs into model config; a missing pad is first filled from EOS when available. Enabled BOS/EOS insertion requires the corresponding tokenizer ID; raw changes are resume-compatible only when the resolved model IDs remain equal.
    auto_set_special_tokens: "<bool>"

    # data.tokenizer.byte_offset -- int; default: 0; >= 0; byte-only. Reserves IDs below the offset and maps bytes to offset..offset+255; model.vocab_size must cover that range, and BOS/EOS insertion requires offset > 0.
    byte_offset: "<int>"

    # data.tokenizer.add_bos -- bool; default: false. Prepends BOS after truncation and before packing, not to generation prompts. Byte mode requires bos_token_id < byte_offset; HF auto-special mode requires a tokenizer BOS ID.
    add_bos: "<bool>"

    # data.tokenizer.add_eos -- bool; default: true. Appends EOS after truncation and before training/eval packing, not to generation prompts; data.train_on_eos controls its loss. Byte mode requires eos_token_id < byte_offset; HF auto-special mode requires a tokenizer EOS ID.
    add_eos: "<bool>"

    # data.tokenizer.max_doc_tokens -- int | null; default: null (no truncation); otherwise > 0. Applied after full tokenization and before inserted specials, only for training/eval packing; generation prompts ignore it. It discards tails without reducing tokenizer peak work.
    # To keep a capped document and its inserted specials in one row, use <= train.seq_len - int(add_bos) - int(add_eos); otherwise a special can spill into a singleton segment with no valid loss target. Leave null unless truncation is intentional.
    max_doc_tokens: "<int | null>"

# train -- mapping | null; default: {}. batch_size, seq_len, grad_accum, effective deterministic behavior, eval_failure_policy, and schedule/target semantics participate in resume checks; other train fields take their current values after resume. Shape changes recompile and follow checkpoint.resume_compat rather than being unconditionally hard.
train:
  # train.seed -- int; default: 0; >= 0. Seeds fresh model/dropout and periodic-generation RNGs; data order uses data.seed. Restored model RNG wins on resume, while generation RNGs restart from the current seed; this key is not compatibility-compared.
  seed: "<int>"

  # train.steps -- int; default: 100; > 0 and > optim.warmup_steps. Total target step, not additional resumed work. With optim.decay_steps=null it determines the LR horizon, so extending it changes the schedule and strict resume rejects; with an unchanged explicit decay duration, a target-only change is allowed but always warns. Default is smoke-scale; maintained schedules span 100000..600000.
  steps: "<int>"

  # train.batch_size -- int; default: 2; > 0. Packed rows per accumulation slice; contributes to packing/shuffle minima. Maintained 100M/200M recipes use 2; 500M/1B templates use 1 and compensate with grad_accum.
  batch_size: "<int>"

  # train.seq_len -- int; default: 128; >= 8; for Megalodon must be >= and divisible by model.chunk_size. Default is smoke-scale; maintained pretrain recipes use 2048. Changing it recompiles; strict resume rejects and warn mode reports then continues.
  seq_len: "<int>"

  # train.grad_accum -- int; default: 1; > 0. Accumulation slices per optimizer step; loss is weighted by valid tokens. Maintained recipes hold 16 sequences per logical batch: 8 slices at batch_size=2 or 16 slices at batch_size=1.
  grad_accum: "<int>"

  # train.jit -- bool; default: true. JIT-compiles train/eval; keep true for training and use false only for focused eager debugging.
  jit: "<bool>"

  # train.deterministic -- bool | null; default: null, computed true only when every active dropout is zero. Explicit values override that rule; effective true disables model.use_checkpoint. Resume compares the effective value, so null and true are equivalent when all active dropout is zero. This controls dropout only: exact checkpoint/data restoration does not make interrupted and continuous GPU runs bit-identical when backend kernels are nondeterministic.
  deterministic: "<bool | null>"

  # train.allow_cpu -- bool; default: false. False requires GPU execution; true permits CPU or any other non-GPU/indeterminate backend rather than forcing CPU. [Debug only]
  allow_cpu: "<bool>"

  # train.log_every -- int; default: 25; > 0. The first completed step after each process start always logs; this controls later completed-step cadence, and evaluation can force an off-cadence row. Training completion alone does not. Use 1 for smoke runs and 25 for maintained pretrain recipes.
  log_every: "<int>"

  # train.eval_every -- int; default: 2500; >= 0. Zero disables eval collection/passes but does not return a null-split hash holdout to training while data.max_eval_samples>0. Any positive value initializes eval data before training when work remains, even when no cadence multiple will occur; passes also require usable data. Cadence may change on resume.
  eval_every: "<int>"

  # train.eval_failure_policy -- string; default: fatal; one of: fatal | disable. Applies to evaluation-data initialization and scheduled passes. Fatal fails the run and an aligned failure checkpoint must pass the same-step evaluation before resumed training or success; disable stops future evaluation and persists failure/last-success status in later metrics and telemetry. Changes follow checkpoint.resume_compat warn/strict semantics.
  eval_failure_policy: "<fatal | disable>"

  # train.generate_every -- int; default: 5000; >= 0; zero disables. Periodic sampling runs only for non-dry Megalodon training and requires effective model.output_size == model.vocab_size. Prompt/setup failures disable sampling for that process; per-sample failures warn and retry at every cadence. Generation RNGs restart on resume.
  generate_every: "<int>"

  # train.generate_input_len -- int | null; default: null, computed as max(1, train.seq_len // 2); otherwise 1..train.seq_len. Generation-only prompt target length.
  generate_input_len: "<int | null>"

  # train.generate_max_tokens -- int | null; default: null, computed as model.chunk_size + 16; otherwise > 0. Maximum new tokens per periodic sample.
  generate_max_tokens: "<int | null>"

  # train.generate_temperature -- float | null; default: null, which uses the installed backend default (currently 1.0); otherwise >= 0. Zero is greedy and ignores stochastic filters.
  generate_temperature: "<float | null>"

  # train.generate_top_k -- int | null; default: null (backend default); otherwise > 0 and, at runtime, <= effective output width. Generation-only cutoff; invalid upper bounds make each scheduled sample warn/skip rather than fail config validation. Irrelevant when temperature=0.
  generate_top_k: "<int | null>"

  # train.generate_top_p -- float | null; default: null (backend default); otherwise 0 < value <= 1. Generation-only nucleus cutoff; irrelevant when temperature=0.
  generate_top_p: "<float | null>"

  # train.profile -- bool; default: false. Enables a full-run JAX trace including first compilation; traces add overhead and can be large, so enable only for focused profiling.
  profile: "<bool>"

  # train.profile_dir -- string | null; default: null, computed as <run_dir>/trace; otherwise nonempty. Used only with profile=true; explicit relative paths resolve from the process working directory.
  profile_dir: "<nonempty string | null>"

# optim -- mapping | null; default: {}. Selects the optimizer and warmup-plus-cosine schedule; every supplied nested value is type/range validated even when inactive. optim.name and optimizer-state structure changes always fail resume; active value changes otherwise follow checkpoint.resume_compat. Muon values are resume-inert under AdamW, while Adam values remain active for Muon's fallback partition.
optim:
  # optim.name -- string; default: adamw; one of: adamw | muon. Muon handles eligible projection matrices and nested Adam handles all others; no eligible matrices falls back to AdamW with a warning. Changing optimizer family always rejects resume. Maintained full-run recipes use Muon; AdamW is the conventional baseline.
  name: "<adamw | muon>"

  # optim.lr -- float; default: 0.0003; > 0. Peak Adam learning rate after warmup; Muon uses this schedule multiplied by optim.muon.lr_scale.
  lr: "<float>"

  # optim.weight_decay -- float; default: 0.01; >= 0; zero disables. Model-aware decay applies to embeddings/dense projections, not biases, norms/scales, attention offsets, or CEMA coefficients; Muon also applies weight_decay_mult.
  weight_decay: "<float>"

  # optim.grad_clip_norm -- float; default: 1.0; >= 0; zero disables. Global clipping occurs after valid-token normalization and before optimizer partitioning; logged grad_norm is pre-clipping. Keep 1.0 as the starting point.
  grad_clip_norm: "<float>"

  # optim.warmup_ratio -- float | null; default: null; 0 <= value < 1. Warmup as a fraction of train.steps, resolved to optim.warmup_steps = round(warmup_ratio * train.steps) after CLI overrides are applied, so shortening train.steps rescales warmup instead of tripping the warmup_steps < train.steps check. Mutually exclusive with optim.warmup_steps in the same config; to override the step count directly on the CLI, also pass optim.warmup_ratio=null. Resume compares the resolved optim.warmup_steps, not this ratio.
  warmup_ratio: "<float | null>"

  # optim.warmup_steps -- int; default: 10; >= 0 and < train.steps. Linear warmup duration, and the resolved value the schedule and resume checks read. Ignored as an input when optim.warmup_ratio is set, which derives it. Maintained pretrain recipes use 1% of their authored step horizon.
  warmup_steps: "<int>"

  # optim.decay_steps -- int | null; default: null, computed as train.steps - warmup_steps; otherwise > 0. This is post-warmup duration, so total schedule horizon = optim.warmup_steps + optim.decay_steps. Extending train.steps with null extends the schedule; set an explicit duration to preserve the original horizon.
  decay_steps: "<int | null>"

  # optim.min_lr_ratio -- float; default: 0.0; 0 <= value <= 1. Final schedule floor divided by optim.lr; maintained pretrain recipes use 0.1, while an explicit decay horizon may end before or after train.steps.
  min_lr_ratio: "<float>"

  # optim.muon -- mapping | null; default: {}; executed and resume-compared only when optim.name=muon. Inactive values remain type/constraint validated.
  muon:
    # optim.muon.lr_scale -- float; default: 100.0; > 0. Multiplier from the Adam schedule to Muon matrix LR; 100 is the maintained choice and narrowly beat 150 in the repository's 10k-step sweep.
    lr_scale: "<float>"

    # optim.muon.weight_decay_mult -- float; default: 1.0; >= 0. Multiplies optim.weight_decay for Muon matrices; zero disables their decay.
    weight_decay_mult: "<float>"

    # optim.muon.momentum -- float; default: 0.95; 0 < value < 1. Muon momentum coefficient.
    momentum: "<float>"

    # optim.muon.ns_steps -- int; default: 5; > 0. Newton-Schulz iterations; more costs compute, so keep 5 unless reproducing another recipe.
    ns_steps: "<int>"

    # optim.muon.nesterov -- bool; default: true. Enables Nesterov momentum on Muon matrices.
    nesterov: "<bool>"

    # optim.muon.consistent_rms -- float | null; default and recommendation: null, which omits optional shape/RMS scaling; otherwise >= 0. Zero suppresses the Muon gradient component while decay may remain. Changing between null/non-null changes optimizer structure and always rejects resume; non-null uses a private Optax contrib helper. [Experimental]
    consistent_rms: "<float | null>"

    # optim.muon.allow_all_2d -- bool; default: false. True overrides the conservative whitelist and sends every 2D tensor, including embeddings and non-matmul CEMA/attention arrays, to Muon. Changing it always rejects Muon resume because parameter routing changes. [Experimental; high-risk]
    allow_all_2d: "<bool>"

    # optim.muon.allow_tied_embed -- bool; default: false. With allow_all_2d=false and model.share_emb=true, adds the embedding to Muon eligibility; for DummyLM this follows the flag even though its weights are not tied. Changing it always rejects Muon resume because parameter routing changes. [Experimental]
    allow_tied_embed: "<bool>"

  # optim.adam -- mapping | null; default: {}. Configures every parameter under AdamW and the non-Muon partition under Muon.
  adam:
    # optim.adam.b1 -- float; default: 0.9; 0 < value < 1. Adam first-moment coefficient.
    b1: "<float>"

    # optim.adam.b2 -- float; default: 0.999; 0 < value < 1. Adam second-moment coefficient.
    b2: "<float>"

    # optim.adam.eps -- float; default: 1e-8; > 0. Adam denominator epsilon.
    eps: "<float>"

    # optim.adam.nesterov -- bool; default: false. Enables Nesterov-style Adam for every Adam-labeled parameter.
    nesterov: "<bool>"

# checkpoint -- mapping | null; default: {}. Controls Orbax save/resume behavior.
checkpoint:
  # checkpoint.enabled -- bool; default: true. False disables saves/resume, makes positive save/retention constraints inactive, and prevents automatic HF branch/tag-to-commit pinning. Keep true for real runs; with false, author a 40-hex hf_revision when immutable data identity matters.
  enabled: "<bool>"

  # checkpoint.save_every -- int; default: 5000; > 0 when enabled. Periodic optimizer-step cadence; aligned final save is separate. Maintained recipes use 2500 through 10000 as checkpoint size grows; 500M/1B retain two complete restore points to bound disk use.
  save_every: "<int>"

  # checkpoint.max_to_keep -- int; default: 3; > 0 when enabled. Orbax permanently deletes older checkpoints beyond this count; increase it when deeper rollback is required.
  max_to_keep: "<int>"

  # checkpoint.async_save -- bool; default: true; used only when enabled. Overlaps I/O with training and is recommended for GPU runs; graceful shutdown waits, but abrupt termination can lose the newest in-flight save.
  async_save: "<bool>"

  # checkpoint.resume_compat -- string; default: warn; one of: strict | warn. Warn mode permits intentional data, objective, schedule, Megalodon-JAX identity, and optimizer-value changes while logging each mismatch; strict rejects them, including missing identity in old checkpoints. Missing metadata is never treated as proven equal. Parameter/optimizer-state structure and Grain restore failures always abort. A sequential <-> bin/multipack switch also aborts when packed-window shuffle is active because its saved row cursor is packer-dependent; use --init-from for that phased change. Maintained long-run recipes select strict.
  resume_compat: "<strict | warn>"

# export -- mapping | null; default: {}. Controls the portable safetensors model written when a run finishes. See docs/export.md.
export:
  # export.on_finish -- bool; default: true. Writes the final checkpoint out as a portable model when the run ends on its own terms; preempted, crashed, and dummy-backend runs are skipped, as are runs with checkpoint.enabled=false (the export is written from the final checkpoint). A failure here is logged at ERROR and does not fail the run.
  on_finish: "<bool>"

  # export.dir_name -- string; default: export; a single directory name, never a path. Destination under the run directory; separators, `.`, and `..` are rejected so an export cannot escape the run or overwrite its checkpoints and tokenizer. A resumed run replaces the previous export.
  dir_name: "<nonempty single path segment>"

  # export.verify -- bool; default: true. Re-reads the written weights and compares every parameter, because safetensors carries no payload checksum. Costs one extra read of the file; leave on.
  verify: "<bool>"

# logging -- mapping | null; default: {}. Relative metrics/log paths are joined to the final run directory but not confined to it; absolute paths or `..` can escape. Files are append-only with no interprocess locking, so never share targets between concurrent runs.
logging:
  # logging.project -- string; default: chomp; nonempty. Used verbatim in generated path runs/<project>/... and as the fallback W&B project; use a simple relative name because absolute/traversal values can escape runs/.
  project: "<nonempty string>"

  # logging.run_dir -- string | null; default: null, computed as runs/<project>/<timestamp>_<config stem>; otherwise nonempty. `--run-dir` takes precedence. Fresh runs refuse existing paths; resume requires the exact existing path.
  run_dir: "<nonempty string | null>"

  # logging.metrics_file -- string; default: metrics.jsonl; nonempty. Relative paths are joined to run_dir; absolute paths are used directly. Writes append without locking; never share it or resolve it to logging.log_file, whose text would corrupt JSONL.
  metrics_file: "<nonempty string>"

  # logging.level -- string; default: INFO; one of: DEBUG | INFO | WARNING | ERROR. INFO is recommended; DEBUG is for diagnosis.
  level: "<DEBUG | INFO | WARNING | ERROR>"

  # logging.console_use_rich -- bool; default: true. Rich interactive formatting; use false for plain machine-captured logs.
  console_use_rich: "<bool>"

  # logging.log_file -- string | null; default: train.log; null disables; otherwise nonempty. Relative paths are joined to run_dir; absolute paths are used directly. Writes append without locking; never share it or resolve it to metrics_file.
  log_file: "<nonempty string | null>"

  # logging.wandb -- mapping | null; default: {}. Nested values are validated even when disabled.
  wandb:
    # logging.wandb.enabled -- bool; default: false. Enables W&B only for non-dry runs; ordinary initialization, artifact, or metric-log failures fail training. Online mode requires authentication. Chomp resume starts a new W&B run, and local files use WANDB_DIR or ./wandb rather than logging.run_dir.
    enabled: "<bool>"

    # logging.wandb.project -- string | null; default: null, computed as logging.project; otherwise nonempty. Set only when remote grouping should differ from local grouping.
    project: "<nonempty string | null>"

    # logging.wandb.entity -- string | null; default: null, which uses the authenticated account's default entity; otherwise nonempty.
    entity: "<nonempty string | null>"

    # logging.wandb.run_name -- string | null; default: null, computed as the final run-directory basename; otherwise nonempty.
    run_name: "<nonempty string | null>"

    # logging.wandb.mode -- string; default: online; one of: online | offline. Offline writes local W&B state for later syncing without live service access.
    mode: "<online | offline>"

    # logging.wandb.tags -- list[string]; default: []; every entry nonempty. Set in YAML/JSON; scalar CLI overrides do not support lists.
    tags: "<list[nonempty string]>"

# debug -- mapping | null; default: {}. Runtime correctness checks.
debug:
  # debug.nan_check -- bool; default: true. Validates synchronized metrics and dry-run/pre-save/final parameters plus optimizer state. False permits non-finite state to be checkpointed; keep true.
  nan_check: "<bool>"

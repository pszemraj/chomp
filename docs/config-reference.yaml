# chomp configuration reference
#
# This is valid YAML containing every accepted configuration key at its literal default.
# Copy it, remove keys you do not need, and change values deliberately. Omitted keys use the
# defaults shown here. Unknown keys and invalid combinations fail before training starts.
#
# Run with: chomp train CONFIG.yaml
# Repeatable scalar override: --override train.steps=2000
# Run-directory override: --run-dir PATH takes precedence over logging.run_dir.
# Resume selector: --resume none | latest | POSITIVE_STEP. The aliases 0, no, and false mean none;
# resume needs an existing compatible run directory and checkpoint. --dry-run validates, builds
# model/data, compiles one step when train.jit is true, and exits.
# CLI overrides run after variable interpolation. Set list values such as logging.wandb.tags here,
# not through --override. A null-default field parses its override as a YAML scalar; put YAML quotes
# inside the shell argument to force a numeric-looking string, for example
# --override 'train.profile_dir="123"'.

# Key: variables
# Type: mapping[str, value]
# Default: {}.
# Required: no.
# Valid: arbitrary nested YAML values. Duplicate mapping keys are rejected while loading.
# Use: reference a value as $variables.path to preserve its type, or interpolate it inside a string
# as {$variables.path} or ${variables.path}. Missing and circular references fail; a malformed
# variable-like substring remains literal and warns.
# Example: define variables: {length: 2048}, then set train.seq_len: $variables.length.
variables: {}

# Key: derived
# Type: mapping
# Default: {}.
# Required: no.
# Valid: any mapping; authored values are ignored.
# Lifecycle: internal use only.
# Warning: resolved snapshots contain runtime-derived values here. Do not set this section in an
# authored experiment; the loader accepts it only so saved resolved configs can be loaded again.
derived: {}

# Key: model
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the model.* keys listed in this section.
# Use: selects the model implementation, architecture, initialization, and precision policy. Every
# model.* value is a hard resume invariant, including fields inactive under the selected backend.
model:
  # Key: model.backend
  # Type: enum string
  # Default: megalodon.
  # Required: no.
  # Valid: megalodon | dummy.
  # Use: megalodon is the training backend. dummy is a debug-only MLP; it uses d_model and ignores
  # Megalodon-only architecture fields.
  backend: megalodon

  # Key: model.vocab_size
  # Type: integer
  # Default: 256.
  # Required: no.
  # Valid: > 0; byte tokenization also requires >= data.tokenizer.byte_offset + 256.
  # Use: tokenizer setup raises this to the tokenizer vocabulary size, then rounds it up to
  # data.tokenizer.vocab_size_multiple. The resolved value determines embedding/output shapes.
  vocab_size: 256

  # Key: model.d_model
  # Type: integer
  # Default: 128.
  # Required: no.
  # Valid: > 0 when model.backend is dummy.
  # Lifecycle: debug only.
  # Use: hidden width for DummyLM; ignored by Megalodon. Keep it small for inexpensive smoke tests.
  d_model: 128

  # Key: model.dropout
  # Type: number
  # Default: 0.0.
  # Required: no.
  # Valid: >= 0.0 and < 1.0.
  # Use: dropout for either backend. A nonzero value makes train.deterministic resolve to false when
  # train.deterministic is null. Use 0.0 for dropout-free replay tests.
  dropout: 0.0

  # Key: model.model_dim
  # Type: integer
  # Default: 128.
  # Required: no.
  # Valid: > 0 and divisible by model.num_heads and model.norm_num_groups.
  # Use: Megalodon hidden width. Larger values increase parameter and activation memory substantially.
  model_dim: 128

  # Key: model.num_layers
  # Type: integer
  # Default: 2.
  # Required: no.
  # Valid: > 0.
  # Use: Megalodon layer count. Increase only after a smaller configuration compiles and fits.
  num_layers: 2

  # Key: model.num_heads
  # Type: integer
  # Default: 1.
  # Required: no.
  # Valid: > 0 and must divide model.model_dim, model.z_dim, and model.value_dim.
  # Use: Megalodon attention-head count.
  num_heads: 1

  # Key: model.z_dim
  # Type: integer
  # Default: 64.
  # Required: no.
  # Valid: > 0, divisible by model.num_heads, and z_dim / num_heads must be even for RoPE.
  # Use: Megalodon query/key projection width.
  z_dim: 64

  # Key: model.value_dim
  # Type: integer
  # Default: 128.
  # Required: no.
  # Valid: > 0 and divisible by model.num_heads.
  # Use: Megalodon value projection width.
  value_dim: 128

  # Key: model.ffn_hidden_dim
  # Type: integer
  # Default: 256.
  # Required: no.
  # Valid: > 0.
  # Use: Megalodon feed-forward hidden width. Roughly 2x to 4x model.model_dim is a practical start.
  ffn_hidden_dim: 256

  # Key: model.cema_ndim
  # Type: integer
  # Default: 16.
  # Required: no.
  # Valid: > 0.
  # Use: number of CEMA components per channel. Higher values add recurrent-state capacity and cost.
  cema_ndim: 16

  # Key: model.chunk_size
  # Type: integer
  # Default: 128.
  # Required: no.
  # Valid: > 0, <= train.seq_len, and must divide train.seq_len.
  # Use: Megalodon attention chunk length. Larger chunks expose more local context and use more memory.
  chunk_size: 128

  # Key: model.attention_window
  # Type: integer | null
  # Default: null, which uses released chunk-local attention with a cache capacity of
  # model.chunk_size.
  # Required: no.
  # Valid: null or an integer > 0.
  # Lifecycle: experimental architecture extension.
  # Use: a positive value replaces chunk-local attention with a causal sliding window of this width
  # in training and generation; it also becomes the fixed inference cache capacity. Keep null for
  # released Megalodon semantics. Changing it is checkpoint-incompatible.
  attention_window: null

  # Key: model.norm_num_groups
  # Type: integer
  # Default: 32.
  # Required: no.
  # Valid: > 0, smaller than model.model_dim, and must divide model.model_dim. A featurewise value
  # equal to model_dim is unsupported because this training model does not configure the learned
  # TimestepNorm prior it requires.
  # Use: Megalodon TimestepNorm group count. The default is a good starting point when divisible.
  norm_num_groups: 32

  # Key: model.norm_eps
  # Type: number
  # Default: 1.0e-5.
  # Required: no.
  # Valid: > 0.
  # Use: numerical-stability epsilon for Megalodon normalization.
  norm_eps: 1.0e-5

  # Key: model.rope_base
  # Type: number | null
  # Default: null, computed by Megalodon as 10000.
  # Required: no.
  # Valid: null or > 0.
  # Use: RoPE frequency base. Change it only as part of a deliberate long-context scaling strategy.
  # Frequencies are derived per model call and never serialized or exposed to the optimizer.
  rope_base: null

  # Key: model.swiglu
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Use: enables SwiGLU in Megalodon's feed-forward network.
  swiglu: false

  # Key: model.rescale_nffn
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Use: enables Megalodon's normalized-FFN residual rescaling. Its learned alpha vector in each
  # layer uses Adam without decoupled weight decay, including when optim.name is muon.
  # Warning: changing this changes model semantics and is checkpoint-incompatible.
  rescale_nffn: false

  # Key: model.scale_emb
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Use: multiplies Megalodon embeddings by sqrt(model.model_dim).
  # Warning: changing this changes model semantics and is checkpoint-incompatible.
  scale_emb: false

  # Key: model.share_emb
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: true ties the language-model output projection to the input embedding matrix, reducing
  # parameters and preserving Chomp's pre-0.2.1 model topology. false creates a separate output
  # matrix even when output_size equals vocab_size.
  # Interaction: true requires model.output_size to be -1 or equal model.vocab_size. Changing this
  # changes parameter topology and is checkpoint-incompatible.
  share_emb: true

  # Key: model.norm_affine
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: enables learned affine parameters in RMSNorm and FFN LayerNorm. TimestepNorm remains affine.
  norm_affine: true

  # Key: model.attention_dropout
  # Type: number
  # Default: 0.0.
  # Required: no.
  # Valid: >= 0.0 and < 1.0.
  # Use: Megalodon attention dropout. Nonzero makes the computed deterministic default false.
  attention_dropout: 0.0

  # Key: model.attention_dropout_mode
  # Type: enum string
  # Default: post_softmax.
  # Required: no.
  # Valid: post_softmax | dropkey.
  # Use: selects whether model.attention_dropout masks attention probabilities after softmax or
  # masks attention scores before softmax. Only affects training when attention_dropout > 0;
  # post_softmax is the recommended default.
  attention_dropout_mode: post_softmax

  # Key: model.hidden_dropout
  # Type: number
  # Default: 0.0.
  # Required: no.
  # Valid: >= 0.0 and < 1.0.
  # Use: Megalodon hidden-state dropout. Nonzero makes the computed deterministic default false.
  hidden_dropout: 0.0

  # Key: model.pad_token_id
  # Type: integer
  # Default: 0.
  # Required: no.
  # Valid: an integer in [0, effective model.vocab_size).
  # Use: padding filler ID and tokenizer metadata. HF auto-special-token setup may replace it;
  # attention/segment masks, not token value, determine which positions are padding.
  # Warning: sharing it with eos_token_id warns because external tooling may infer padding from IDs.
  pad_token_id: 0

  # Key: model.bos_token_id
  # Type: integer
  # Default: 1.
  # Required: no.
  # Valid: in [0, effective model.vocab_size); byte mode additionally requires it below
  # data.tokenizer.byte_offset when add_bos is true.
  # Use: beginning-of-sequence token ID. HF auto-special-token setup may replace it. Periodic and
  # standalone generation consume this ID even when add_bos is false.
  bos_token_id: 1

  # Key: model.eos_token_id
  # Type: integer
  # Default: 2.
  # Required: no.
  # Valid: in [0, effective model.vocab_size); byte mode additionally requires it below
  # data.tokenizer.byte_offset when add_eos is true.
  # Use: end-of-sequence token ID. HF auto-special-token setup may replace it. Periodic and
  # standalone generation consume it even when add_eos is false; an out-of-vocabulary ID cannot
  # terminate generation.
  eos_token_id: 2

  # Key: model.init_mode
  # Type: enum string
  # Default: he.
  # Required: no.
  # Valid: gaussian | xavier | he | bert.
  # Use: Megalodon parameter initializer. he is recommended for fresh training.
  init_mode: he

  # Key: model.use_checkpoint
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Use: requests model-internal activation checkpointing to trade compute for lower memory.
  # Interaction: derived deterministic training disables it in Megalodon and emits a warning.
  use_checkpoint: false

  # Key: model.output_size
  # Type: integer
  # Default: -1, computed as the effective vocabulary size.
  # Required: no.
  # Valid: -1 or > 0.
  # Use: Megalodon output width. -1 resolves to effective model.vocab_size. Tying is controlled only
  # by model.share_emb; when share_emb is false, the output matrix remains separate at every width.
  # Interaction: share_emb=true requires -1 or model.vocab_size. Labels must remain below the
  # resolved output size, so keep -1 unless a custom head is deliberate.
  output_size: -1

  # Key: model.use_associative_segment_scan
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Lifecycle: experimental.
  # Use: affects Megalodon only for bin/multipack with strict segments. true is faster with higher
  # peak memory; false uses a sequential constant-memory CEMA scan.
  use_associative_segment_scan: true

  # Key: model.param_dtype
  # Type: enum string
  # Default: float32.
  # Required: no.
  # Valid: float32 only.
  # Use: parameter and optimizer-state dtype.
  # Warning: chomp has no FP32 master-parameter path. Lower-precision parameters would also lower
  # optimizer-state precision; use bfloat16 only for compute_dtype.
  param_dtype: float32

  # Key: model.compute_dtype
  # Type: enum string
  # Default: bfloat16.
  # Required: no.
  # Valid: float32 | bfloat16. FP16 is unsupported.
  # Use: activation/GEMM dtype. bfloat16 is recommended on supported accelerators. float32 requires
  # model.accum_dtype to remain float32.
  compute_dtype: bfloat16

  # Key: model.accum_dtype
  # Type: enum string
  # Default: float32.
  # Required: no.
  # Valid: float32 only.
  # Use: Megalodon GEMM preferred accumulation plus attention score/value matmul accumulation dtype,
  # unrelated to train.grad_accum. Megalodon requires FP32 for numerical stability.
  accum_dtype: float32

  # Key: model.attention_softmax_dtype
  # Type: enum string
  # Default: float32.
  # Required: no.
  # Valid: float32 | bfloat16.
  # Use: attention softmax dtype, independent of the language-model loss. FP32 is recommended;
  # BF16 is an opt-in direct lower-precision reduction and is not released-source parity.
  attention_softmax_dtype: float32

  # Key: model.loss_softmax_dtype
  # Type: enum string
  # Default: float32.
  # Required: no.
  # Valid: float32 | bfloat16.
  # Use: causal-LM log-softmax and loss-reduction dtype, independent of attention. FP32 is
  # recommended for stable long-run training.
  loss_softmax_dtype: float32

  # Key: model.loss_chunk_size
  # Type: integer | null
  # Default: null, which materializes the full FP32 (batch, sequence, vocabulary) logits tensor.
  # Required: no; valid only when model.backend is megalodon.
  # Valid: null or an integer > 0. The value is static and changing it recompiles train/eval steps.
  # Use: a positive value projects at most this many flattened shifted token states at once during
  # loss computation, bounding vocabulary-head intermediates without changing attention, packing,
  # masking, or loss math. The backward pass rematerializes each chunk, trading throughput for lower
  # peak memory. Full-logits storage is approximately batch_size * (seq_len - 1) * vocab_size * 4
  # bytes per microbatch before backward/compiler workspace. Choose the largest value that fits;
  # start with 256 for 32K-vocabulary long-context runs and benchmark against null on the target GPU.
  loss_chunk_size: null

# Key: data
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the data.* keys listed in this section.
# Use: selects the source, packing behavior, evaluation sample, tokenizer, and input pipeline.
data:
  # Key: data.backend
  # Type: enum string
  # Default: hf.
  # Required: no.
  # Valid: hf | local_text.
  # Use: hf streams a Hugging Face dataset. local_text tokenizes the literal data.local_text value
  # once per source epoch and repeats it only when data.repeat is true; it is debug-only and is not
  # a local file path.
  backend: hf

  # Key: data.hf_dataset
  # Type: string
  # Default: Zyphra/Zyda-2.
  # Required: nonempty when data.backend is hf; ignored for local_text.
  # Valid: nonempty Hugging Face dataset repository ID.
  # Use: identifies the streaming dataset repository.
  hf_dataset: Zyphra/Zyda-2

  # Key: data.hf_name
  # Type: string
  # Default: sample-100BT.
  # Required: nonempty when data.backend is hf; ignored for local_text.
  # Valid: nonempty dataset configuration/subset name.
  # Use: selects the named Hugging Face dataset configuration.
  hf_name: sample-100BT

  # Key: data.hf_split
  # Type: string
  # Default: train.
  # Required: nonempty when data.backend is hf; ignored for local_text.
  # Valid: nonempty split name.
  # Use: selects the training split. Despite being inactive as a local-text source selector, this
  # value is recorded in the eval-cache manifest and changing it can reject a local-text resume.
  hf_split: train

  # Key: data.hf_revision
  # Type: string | null
  # Default: bc389cd62969a275b2e3c3e11db826ba1918411a (the pinned default Zyda-2 commit).
  # Required: a full commit when data.backend is hf and checkpoint.enabled is true; otherwise no.
  # Valid: null or a nonempty branch, tag, or commit.
  # Constraint: checkpointed HF runs accept only an exact 40-hex commit. null, branches, and tags are
  # accepted only when checkpoint.enabled is false, for explicitly non-resumable exploration.
  # Use: pins the dataset repository revision passed to Hugging Face so source contents and shard
  # layout cannot drift between starts. Resume hard-compares this value for HF sources.
  hf_revision: bc389cd62969a275b2e3c3e11db826ba1918411a

  # Key: data.hf_eval_split
  # Type: string | null
  # Default: null, which creates a deterministic content-hash holdout from data.hf_split.
  # Required: no; ignored for local_text.
  # Valid: null or a nonempty split name different from data.hf_split when max_eval_samples > 0.
  # Use: exact evaluation split. Any loading, authentication, schema, decoding, or collection error
  # fails startup; there is no implicit fallback. null assigns documents by stable content hash:
  # held-out content feeds eval and is excluded from training, including duplicate copies.
  # Resume: this value is hard-compared even for local_text because it identifies the pinned eval set.
  hf_eval_split: null

  # Key: data.hf_eval_holdout_fraction
  # Type: number
  # Default: 0.01 (1% of content identities).
  # Required: no; used only for hf when hf_eval_split is null and max_eval_samples > 0.
  # Valid: > 0 and < 1.
  # Use: share of stable content hashes reserved exclusively for eval. 0.01 is recommended; lower
  # values retain more training data but scan more source documents to collect max_eval_samples.
  # Holdout collection does not apply document-window shuffle. Changing this changes training order.
  # Resume: hard-compared when active; the hash-partition schema is also hard-gated.
  hf_eval_holdout_fraction: 0.01

  # Key: data.text_key
  # Type: string
  # Default: text.
  # Required: nonempty when data.backend is hf; ignored for local_text.
  # Valid: nonempty dataset column name.
  # Use: names the field containing document text.
  text_key: text

  # Key: data.shuffle
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: enables chomp's fixed-window HF document shuffle; local_text ignores it. Packed
  # training-row shuffling is separately controlled by data.window_shuffle_tokens. Eval rows are
  # never window-shuffled.
  shuffle: true

  # Key: data.shuffle_buffer_size
  # Type: integer
  # Default: 10000.
  # Required: no; used only for the HF backend when data.shuffle is true.
  # Valid: > 0 when shuffle is true.
  # Use: number of HF documents in each chomp-owned shuffle window. Larger windows improve mixing
  # and consume more host memory, but data.shuffle_buffer_bytes can end a window first. Checkpoints
  # replay the current source window from compact state; they do not serialize its documents. Resume
  # hard-compares this value even when shuffle is false.
  shuffle_buffer_size: 10000

  # Key: data.shuffle_buffer_bytes
  # Type: integer
  # Default: 536870912 (512 MiB of UTF-8 document payload).
  # Required: no; used only for the HF backend when data.shuffle is true.
  # Valid: > 0 when shuffle is true.
  # Use: host-memory budget for each chomp-owned document-shuffle window. A window ends after reaching
  # this byte budget or data.shuffle_buffer_size, whichever occurs first. The document that reaches
  # the budget remains in the window, so one oversized document can exceed it; no document is dropped
  # or read ahead. Lower this on memory-constrained hosts. Resume hard-compares this value.
  shuffle_buffer_bytes: 536870912

  # Key: data.seed
  # Type: integer
  # Default: 0.
  # Required: no.
  # Valid: >= 0.
  # Use: document- and packed-training-window shuffle seed. Packed windows internally add a fixed
  # offset and normalize the result modulo 2**32 for Grain. HF resume hard-compares the raw value even
  # when document shuffle is false; either backend hard-compares the packed-window seed when enabled.
  seed: 0

  # Key: data.repeat
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: repeats the training source after exhaustion. Keep true for step-based training; false
  # stops early if a finite source ends before train.steps. A usable final window and missing batch
  # rows are padded, trained, and saved before exact exhaustion is reported.
  repeat: true

  # Key: data.max_retries
  # Type: integer
  # Default: 3.
  # Required: no; used only for HF streaming.
  # Valid: >= 0; zero disables retries.
  # Use: maximum recovery attempts after an HF read failure.
  max_retries: 3

  # Key: data.retry_delay_sec
  # Type: number
  # Default: 1.0.
  # Required: no; used only for HF streaming retries.
  # Valid: >= 0.
  # Use: base delay in seconds for exponential HF retry backoff: retry_delay_sec * 2**attempt.
  retry_delay_sec: 1.0

  # Key: data.state_update_interval
  # Type: integer
  # Default: 2000.
  # Required: no; used only for HF streaming.
  # Valid: > 0.
  # Use: examples between in-run retry snapshots. Recovery restores the last snapshot and rereads,
  # then discards exactly the already-yielded examples, so order stays exact. Lower values reduce
  # recovery work and add state-capture overhead. Checkpoints capture current state independently.
  state_update_interval: 2000

  # Key: data.local_text
  # Type: string
  # Default: "Hello from chomp.\n".
  # Required: nonempty when data.backend is local_text; ignored for hf.
  # Valid: nonempty literal text.
  # Lifecycle: debug only.
  # Use: inline content, not a path. Use YAML block syntax for multiline input. For a quick smoke run,
  # set data.window_shuffle_tokens to 0; its default otherwise fills one token-budgeted window first.
  local_text: "Hello from chomp.\n"

  # Key: data.packing_mode
  # Type: enum string
  # Default: sequential.
  # Required: no.
  # Valid: sequential | bin | multipack.
  # Use: sequential treats the corpus as a continuous token stream and right-pads its finite final
  # tail. bin and multipack use First-Fit-Decreasing and flush tails into padded rows; both can
  # combine unrelated documents. Missing rows in a finite final batch are padded, never discarded.
  packing_mode: sequential

  # Key: data.packing_buffer_docs
  # Type: integer
  # Default: 128.
  # Required: only used when data.packing_mode is bin.
  # Valid: > 0 and >= train.batch_size * train.grad_accum in bin mode.
  # Use: prepared-segment lookahead for bin FFD packing. Long source documents may contribute several
  # seq_len-sized segments. Larger values can improve utilization and increase memory/startup latency.
  packing_buffer_docs: 128

  # Key: data.packing_max_docs_per_bin
  # Type: integer | null
  # Default: null, meaning no document-count cap.
  # Required: no; used only for bin and multipack.
  # Valid: null or > 0.
  # Use: caps segments per packed row, not necessarily source documents because long documents are
  # split first. Lower caps reduce segmentation overhead and may waste tokens.
  packing_max_docs_per_bin: null

  # Key: data.packing_group_docs
  # Type: integer
  # Default: 512.
  # Required: only used when data.packing_mode is multipack.
  # Valid: > 0 in multipack mode.
  # Use: multipack prepared-segment lookahead. The effective trigger is max(packing_group_docs,
  # train.batch_size * train.grad_accum); only end-of-stream flush can emit below that threshold.
  # Larger groups improve packing and increase memory/latency.
  packing_group_docs: 512

  # Key: data.packing_strict_segments
  # Type: boolean
  # Default: true.
  # Required: no; used only for bin and multipack.
  # Valid: true | false; true requires data.mask_boundary_loss to be true.
  # Use: isolates attention, RoPE, CEMA, and TimestepNorm between packed documents. Keep true.
  # Warning: false deliberately permits cross-document recurrent-state and attention leakage.
  packing_strict_segments: true

  # Key: data.mask_boundary_loss
  # Type: boolean
  # Default: true.
  # Required: must be true for bin/multipack when data.packing_strict_segments is true.
  # Valid: true | false subject to the interaction above.
  # Use: excludes next-token targets crossing document boundaries. Keep true for independent docs.
  # Warning: false changes loss-token counts and token-weighted gradient accumulation. If masking
  # leaves an entire batch with no valid shifted targets, batch assembly fails before optimization.
  mask_boundary_loss: true

  # Key: data.train_on_eos
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: false masks every label equal to model.eos_token_id, including naturally encoded collisions,
  # not only EOS inserted by add_eos. With default byte mode, raw byte 0x02 maps to EOS ID 2.
  # Warning: if this and boundary/padding masks remove every shifted target in a batch, training
  # fails before changing parameters, optimizer state, schedule, RNG, or step.
  train_on_eos: true

  # Key: data.window_shuffle_tokens
  # Type: integer
  # Default: 8388608 (2^23 packed tokens; 4096 rows at seq_len 2048).
  # Required: no.
  # Valid: zero, or >= train.seq_len * train.batch_size * train.grad_accum.
  # Use: packed-token memory budget for training-row shuffle; eval never uses it. Chomp divides by
  # train.seq_len and rounds rows down to a train.batch_size * train.grad_accum multiple. The two
  # buffered int32 arrays use about 8 bytes per budgeted token (64 MiB at default), independent of
  # context length. zero disables shuffling and is not recommended for domain-ordered/long-doc data.
  window_shuffle_tokens: 8388608

  # Key: data.grain_prefetch
  # Type: integer
  # Default: 0.
  # Required: no.
  # Valid: >= 0; zero disables prefetch.
  # Use: Grain batches prefetched ahead. Raise only after measuring input stalls; prefetched batches
  # consume memory. With data.device_put true, background-thread device transfers may be unsafe.
  grain_prefetch: 0

  # Key: data.max_eval_samples
  # Type: integer
  # Default: 1000.
  # Required: no.
  # Valid: >= 0; zero disables evaluation data.
  # Use: maximum source examples collected into the pinned evaluation token cache. Setup collects
  # them even when eval_every is 0; max_eval_samples 0 or --dry-run skips collection. This is not a
  # token/window count: zero collected documents fails at setup, while too few full A*B rows or
  # all-masked labels fails when evaluation first runs. Changing it is rejected on resume.
  max_eval_samples: 1000

  # Key: data.recreate_eval_cache
  # Type: boolean
  # Default: false, so a missing cache aborts resume when data.max_eval_samples > 0.
  # Required: no; read only when resuming with a missing pinned evaluation cache.
  # Valid: true | false.
  # Lifecycle: one-shot operational recovery switch.
  # Warning: true rebuilds only after resume compatibility succeeds, but a newly sampled cache can
  # break metric comparability across the resume boundary. Turn it back off after recovery.
  recreate_eval_cache: false

  # Key: data.tokenizer
  # Type: mapping
  # Default: omitted or {}, which applies every data.tokenizer.* default below.
  # Required: no.
  # Valid: only the data.tokenizer.* keys listed in this block.
  # Use: selects tokenization, special tokens, truncation, and vocabulary alignment.
  tokenizer:
    # Key: data.tokenizer.kind
    # Type: enum string
    # Default: byte.
    # Required: no.
    # Valid: byte | hf.
    # Use: hf is recommended for real pretraining. byte maps UTF-8 bytes and supports offline/debug
    # runs. The resolved tokenizer identity is resume-critical.
    kind: byte

    # Key: data.tokenizer.hf_name_or_path
    # Type: string | null
    # Default: pszemraj/bytebpe-tokenizer-32k-mlm.
    # Required: nonempty when data.tokenizer.kind is hf; ignored for byte.
    # Valid: Hugging Face repository ID or local tokenizer directory, or null in byte mode.
    # Use: selects the tokenizer assets loaded by transformers.
    hf_name_or_path: pszemraj/bytebpe-tokenizer-32k-mlm

    # Key: data.tokenizer.hf_use_fast
    # Type: boolean
    # Default: true.
    # Required: no; used only for hf.
    # Valid: true | false.
    # Use: requests a fast tokenizer. Keep true unless the selected tokenizer lacks one.
    hf_use_fast: true

    # Key: data.tokenizer.hf_trust_remote_code
    # Type: boolean
    # Default: false.
    # Required: no; used only for hf.
    # Valid: true | false.
    # Use: passes the remote-code permission to the Hugging Face tokenizer loader.
    # Warning: true permits the tokenizer repository to execute custom Python. Enable only for a
    # trusted and reviewed repository.
    hf_trust_remote_code: false

    # Key: data.tokenizer.vocab_size_multiple
    # Type: integer
    # Default: 128.
    # Required: no.
    # Valid: > 0.
    # Use: rounds the effective embedding vocabulary up to this alignment. 128 is accelerator-friendly
    # for HF tokenizers. Byte mode with byte_offset > 0 may create unused output IDs above offset+255;
    # generated unused IDs cannot be decoded as bytes, so test generation or use a compatible size.
    vocab_size_multiple: 128

    # Key: data.tokenizer.auto_set_special_tokens
    # Type: boolean
    # Default: true.
    # Required: no; used only for hf.
    # Valid: true | false.
    # Use: copies tokenizer-provided pad/BOS/EOS IDs into model config when available. Keep true;
    # when false, verify model.pad_token_id, bos_token_id, and eos_token_id explicitly.
    # Resume: its raw value is hard-compared even in byte mode, where it has no tokenization effect.
    auto_set_special_tokens: true

    # Key: data.tokenizer.byte_offset
    # Type: integer
    # Default: 0.
    # Required: no; used only for byte.
    # Valid: >= 0; must be > 0 if byte mode inserts BOS or EOS.
    # Use: reserves IDs below the offset for special tokens and maps bytes to offset..offset+255.
    # Interaction: model.vocab_size must be at least byte_offset + 256.
    byte_offset: 0

    # Key: data.tokenizer.add_bos
    # Type: boolean
    # Default: false.
    # Required: no.
    # Valid: true | false.
    # Use: prepends BOS to every train/eval document entering a packer; generation prompts do not add
    # it. Byte mode requires byte_offset > 0 and
    # model.bos_token_id < byte_offset; the ID must also be inside the effective vocabulary.
    add_bos: false

    # Key: data.tokenizer.add_eos
    # Type: boolean
    # Default: false.
    # Required: no.
    # Valid: true | false.
    # Use: appends EOS to every train/eval document entering a packer; generation prompts do not add
    # it. Byte mode requires byte_offset > 0 and
    # model.eos_token_id < byte_offset. data.train_on_eos controls whether it contributes to loss.
    add_eos: false

    # Key: data.tokenizer.max_doc_tokens
    # Type: integer | null
    # Default: null, meaning documents are not truncated.
    # Required: no.
    # Valid: null or > 0.
    # Use: optional explicit cap on encoded document tokens before inserted BOS/EOS and packing.
    # Tokenization processes the full raw document before this cap, so it does not limit tokenizer
    # memory or CPU time. Truncation permanently discards document tails; leave null unless that loss
    # is intentional. Monitor source_tokens_discarded, source_truncation_fraction, docs_truncated,
    # and the source_doc_tokens_p*_upper length bounds when a positive cap is active.
    max_doc_tokens: null

  # Key: data.device_put
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Lifecycle: experimental performance option.
  # Use: true transfers batches inside the iterator; false transfers in the training loop. Keep
  # false unless profiling shows a benefit. It affects only the training iterator; eval transfers in
  # its loop. true disables pipeline stats and can interact poorly with grain_prefetch background
  # threads. A resume change warns without prefetch and hard-fails if either side uses prefetch.
  device_put: false

# Key: train
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the train.* keys listed in this section.
# Use: controls training duration, batch shape, evaluation, generation, and profiling.
train:
  # Key: train.seed
  # Type: integer
  # Default: 0.
  # Required: no.
  # Valid: >= 0.
  # Use: fresh model/dropout RNG plus two periodic-generation RNGs. Data ordering normally uses
  # data.seed; train-split eval uses train.seed when data.seed is 0. Restored model/dropout RNG
  # supersedes this value on resume, and generation RNGs restart rather than restore.
  seed: 0

  # Key: train.steps
  # Type: integer
  # Default: 100.
  # Required: no.
  # Valid: > 0 and > optim.warmup_steps.
  # Use: total target optimizer step, not additional resumed steps. With optim.decay_steps null, it
  # also fixes the schedule horizon. Resume warns on a changed target but hard-fails if the effective
  # schedule horizon changes; set explicit decay_steps before the first run if later extension is
  # planned. A run already at or above this target performs no updates.
  steps: 100

  # Key: train.batch_size
  # Type: integer
  # Default: 2.
  # Required: no.
  # Valid: > 0.
  # Use: packed rows per accumulation slice. One outer optimizer step consumes batch_size * grad_accum
  # rows; valid tokens are lower when masks/padding apply. It also sets the bin-buffer minimum and the
  # smallest useful window-shuffle size. This shape is a hard resume invariant.
  batch_size: 2

  # Key: train.seq_len
  # Type: integer
  # Default: 128.
  # Required: no.
  # Valid: >= 8; for Megalodon, >= model.chunk_size and divisible by model.chunk_size.
  # Use: tokens per packed row. It also bounds generate_input_len and strongly affects
  # memory/recompilation. This shape is a hard resume invariant.
  seq_len: 128

  # Key: train.grad_accum
  # Type: integer
  # Default: 1.
  # Required: no.
  # Valid: > 0.
  # Use: scan slices accumulated before one outer update. Loss/gradients are weighted by valid loss
  # tokens rather than equally per slice; accumulation, normalization, and clipping are FP32. This is
  # a hard resume invariant and contributes to packing thresholds.
  grad_accum: 1

  # Key: train.jit
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: JIT-compiles train and eval steps. Keep true for training; false is eager/debug mode and a
  # dry run does not compile in that mode.
  jit: true

  # Key: train.deterministic
  # Type: boolean | null
  # Default: null, computed as true only when all active model dropouts are zero.
  # Required: no.
  # Valid: true | false | null; an explicit boolean overrides the computed rule.
  # Use: controls dropout/key behavior only. It does not enable deterministic GPU kernels or bit-exact
  # arithmetic; use XLA_FLAGS=--xla_gpu_deterministic_ops=true separately when required.
  # Interaction: effective true bypasses model.use_checkpoint in Megalodon. For zero-dropout math with
  # activation checkpointing, set this explicitly false and keep all dropout rates 0. The raw value is
  # hard-compared on resume, so null -> true is rejected even when effective behavior matches.
  deterministic: null

  # Key: train.allow_cpu
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Lifecycle: debug only.
  # Use: false requires JAX's default device and every checked batch to use the CUDA GPU backend at
  # both the Python API and CLI boundary. Enable only for small CPU smoke tests.
  allow_cpu: false

  # Key: train.log_every
  # Type: integer
  # Default: 25.
  # Required: no.
  # Valid: > 0.
  # Use: outer-step interval for local/W&B/console metric rows. Eval forces a row off cadence;
  # checkpoint-only syncs do not. Generation has separate console output.
  log_every: 25

  # Key: train.eval_every
  # Type: integer
  # Default: 2500.
  # Required: no.
  # Valid: >= 0; zero disables periodic evaluation.
  # Use: exact global-step interval. Evaluation also requires nonempty pinned eval tokens and enough
  # windows for one full grad_accum * batch_size batch. This cadence may change on resume.
  eval_every: 2500

  # Key: train.generate_every
  # Type: integer
  # Default: 5000.
  # Required: no.
  # Valid: >= 0; zero disables periodic generation.
  # Use: exact global-step sample interval for non-dry Megalodon runs; set 0 if samples are unwanted.
  # It samples from a bounded pool of up to 16 unshuffled training-split documents and does not affect
  # optimization. The prompt RNG is not checkpointed, so prompt selection restarts on resume. Prompt
  # loading failures disable sampling; individual generation failures warn and training continues.
  generate_every: 5000

  # Key: train.generate_input_len
  # Type: integer | null
  # Default: null, computed as max(1, train.seq_len // 2).
  # Required: no; used only when periodic generation is enabled.
  # Valid: null or an integer from 1 through train.seq_len.
  # Use: target source-token prompt length. Trailing EOS is trimmed; short documents use what remains,
  # while long documents randomly select a prefix or suffix of this length.
  generate_input_len: null

  # Key: train.generate_max_tokens
  # Type: integer | null
  # Default: null, computed as model.chunk_size + 16.
  # Required: no; used only when periodic generation is enabled.
  # Valid: null or > 0.
  # Use: maximum new tokens per generated sample. Larger values increase sampling time.
  generate_max_tokens: null

  # Key: train.generate_temperature
  # Type: number | null
  # Default: null, which uses the generation backend default.
  # Required: no; used only when periodic generation is enabled.
  # Valid: null or >= 0; zero requests greedy selection.
  # Use: sampling temperature. null currently means backend default 1.0. Zero is greedy and does not
  # consume a sampling key; positive values use seeded stochastic sampling.
  generate_temperature: null

  # Key: train.generate_top_k
  # Type: integer | null
  # Default: null, which uses the generation backend default.
  # Required: no; used only when periodic generation is enabled.
  # Valid: null or > 0.
  # Use: top-k sampling cutoff; the greedy temperature=0 path ignores stochastic filters.
  generate_top_k: null

  # Key: train.generate_top_p
  # Type: number | null
  # Default: null, which uses the generation backend default.
  # Required: no; used only when periodic generation is enabled.
  # Valid: null or > 0 and <= 1.
  # Use: nucleus-sampling probability threshold; the greedy temperature=0 path ignores it.
  generate_top_p: null

  # Key: train.profile
  # Type: boolean
  # Default: false.
  # Required: no.
  # Valid: true | false.
  # Use: enables a full-run JAX trace starting before the loop/dry-run step, including first-step
  # compilation and later eval/generation/finalization. Traces add overhead and can become very large.
  profile: false

  # Key: train.profile_dir
  # Type: string | null
  # Default: null, computed as <resolved run directory>/trace.
  # Required: no; used only when train.profile is true.
  # Valid: null or a nonempty filesystem path string.
  # Use: profiler trace output directory. An explicit relative path resolves from the process working
  # directory, not logging.run_dir.
  profile_dir: null

# Key: optim
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the optim.* keys listed in this section.
# Use: selects AdamW or Muon and configures the warmup-plus-cosine schedule.
optim:
  # Key: optim.name
  # Type: enum string
  # Default: adamw.
  # Required: no.
  # Valid: adamw | muon.
  # Use: adamw updates every parameter with AdamW. muon updates eligible 2D matrices with Muon and
  # all others with nested Adam; if no matrix matches, runtime warns and effectively uses AdamW for
  # all parameters. Optimizer selection/state is a hard resume invariant.
  name: adamw

  # Key: optim.lr
  # Type: number
  # Default: 0.0003.
  # Required: no.
  # Valid: > 0.
  # Use: peak Adam learning rate after warmup. Muon matrix updates use this schedule multiplied by
  # optim.muon.lr_scale. Tune it with effective batch size.
  lr: 0.0003

  # Key: optim.weight_decay
  # Type: number
  # Default: 0.01.
  # Required: no.
  # Valid: >= 0; zero disables weight decay.
  # Use: AdamW decay coefficient. The explicit model-aware mask includes token embeddings and dense
  # projection weights. It excludes biases, norms/scales, attention affine offsets, fixed RoPE
  # buffers, and CEMA coefficients. Muon matrices additionally multiply it by muon.weight_decay_mult.
  weight_decay: 0.01

  # Key: optim.grad_clip_norm
  # Type: number
  # Default: 1.0.
  # Required: no.
  # Valid: >= 0; zero disables clipping.
  # Use: global threshold over the combined valid-token-normalized gradient tree before optimizer
  # partitioning. Logged grad_norm is pre-clipping. 1.0 is a safe start.
  grad_clip_norm: 1.0

  # Key: optim.warmup_steps
  # Type: integer
  # Default: 10.
  # Required: no.
  # Valid: >= 0 and < train.steps.
  # Use: linear-warmup duration. No warmup-ratio alternative exists.
  warmup_steps: 10

  # Key: optim.decay_steps
  # Type: integer | null
  # Default: null, computed as train.steps - optim.warmup_steps.
  # Required: no.
  # Valid: null or > 0.
  # Use: post-warmup cosine duration. Total horizon is warmup_steps + decay_steps; after it, Optax
  # holds the min_lr_ratio floor. An explicit horizon may precede or exceed train.steps. Resume compares
  # the effective horizon, so null -> an explicitly equal duration is allowed but any drift hard-fails.
  decay_steps: null

  # Key: optim.min_lr_ratio
  # Type: number
  # Default: 0.0.
  # Required: no.
  # Valid: 0.0 through 1.0 inclusive.
  # Use: floor divided by optim.lr at/after the schedule horizon. It is not necessarily the final-step
  # LR when explicit decay_steps makes the training and schedule horizons differ.
  min_lr_ratio: 0.0

  # Key: optim.muon
  # Type: mapping
  # Default: omitted or {}, which applies every optim.muon.* default below.
  # Required: no; used only when optim.name is muon.
  # Valid: only the optim.muon.* keys listed in this block.
  # Use: configures Muon updates for eligible matrices. These values are validated even under AdamW;
  # resume ignores their drift only when both saved and current optimizers are non-Muon.
  muon:
    # Key: optim.muon.lr_scale
    # Type: number
    # Default: 100.0.
    # Required: no; used only for Muon-eligible parameters.
    # Valid: > 0.
    # Use: multiplier from the Adam schedule to the Muon matrix learning rate. The large default is
    # intentional for Muon's parameterization; do not apply Adam LR intuition directly.
    lr_scale: 100.0

    # Key: optim.muon.weight_decay_mult
    # Type: number
    # Default: 1.0.
    # Required: no; used only for Muon-eligible parameters.
    # Valid: >= 0.
    # Use: multiplier on optim.weight_decay for Muon matrices; zero disables their decay.
    weight_decay_mult: 1.0

    # Key: optim.muon.momentum
    # Type: number
    # Default: 0.95.
    # Required: no; used only when optim.name is muon.
    # Valid: > 0 and < 1.
    # Use: Muon momentum coefficient.
    momentum: 0.95

    # Key: optim.muon.ns_steps
    # Type: integer
    # Default: 5.
    # Required: no; used only when optim.name is muon.
    # Valid: > 0.
    # Use: Newton-Schulz orthogonalization iterations. More iterations cost more compute; keep 5
    # unless reproducing a recipe that specifies otherwise.
    ns_steps: 5

    # Key: optim.muon.nesterov
    # Type: boolean
    # Default: true.
    # Required: no; used only when optim.name is muon.
    # Valid: true | false.
    # Use: enables Nesterov momentum for Muon matrix updates.
    nesterov: true

    # Key: optim.muon.consistent_rms
    # Type: number | null
    # Default: null, which omits Muon's optional shape/RMS scaling transform.
    # Required: no; used only when optim.name is muon.
    # Valid: null or >= 0.
    # Use: enables an additional shape transform scaling updates by sqrt(max(fan_in, fan_out)) times
    # this value. null skips that transform. Zero suppresses the Muon gradient component but decay may
    # still act, so use null to disable and a positive value only for a known recipe.
    consistent_rms: null

    # Key: optim.muon.allow_all_2d
    # Type: boolean
    # Default: false.
    # Required: no; used only when optim.name is muon.
    # Valid: true | false.
    # Lifecycle: experimental eligibility override.
    # Warning: true takes precedence over the whitelist/allow_tied_embed and sends every 2D tensor to
    # the fixed Muon orientation, including embeddings and non-matmul CEMA/attention gamma parameters.
    # Keep false unless that partition is explicitly intended; inspect logged split/sample paths.
    allow_all_2d: false

    # Key: optim.muon.allow_tied_embed
    # Type: boolean
    # Default: false.
    # Required: no; used only when optim.name is muon.
    # Valid: true | false.
    # Lifecycle: experimental eligibility override.
    # Use: when allow_all_2d is false and model.share_emb is true, adds only embed.weight to the
    # conservative Muon whitelist. It has no effect on an untied embedding or other 2D tensors.
    allow_tied_embed: false

  # Key: optim.adam
  # Type: mapping
  # Default: omitted or {}, which applies every optim.adam.* default below.
  # Required: no; used for all parameters under adamw and the non-Muon partition under muon.
  # Valid: only the optim.adam.* keys listed in this block.
  # Use: configures Adam moment estimation and is always resume-critical. The conservative Muon
  # whitelist contains 2D attention wz/wv/wr/wh1/wh2, FFN fc1/fc2/fc3, and lm_head weights; all
  # other leaves, including embeddings/norms/CEMA, use this Adam block unless overrides expand Muon.
  adam:
    # Key: optim.adam.b1
    # Type: number
    # Default: 0.9.
    # Required: no.
    # Valid: > 0 and < 1.
    # Use: Adam first-moment coefficient.
    b1: 0.9

    # Key: optim.adam.b2
    # Type: number
    # Default: 0.999.
    # Required: no.
    # Valid: > 0 and < 1.
    # Use: Adam second-moment coefficient.
    b2: 0.999

    # Key: optim.adam.eps
    # Type: number
    # Default: 1.0e-8.
    # Required: no.
    # Valid: > 0.
    # Use: Adam denominator epsilon.
    eps: 1.0e-8

    # Key: optim.adam.nesterov
    # Type: boolean
    # Default: false.
    # Required: no.
    # Valid: true | false.
    # Use: enables Nesterov-style Adam for all Adam-labeled parameters.
    nesterov: false

# Key: checkpoint
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the checkpoint.* keys listed in this section.
# Use: controls Orbax checkpoint storage, cadence, retention, and resume availability.
checkpoint:
  # Key: checkpoint.enabled
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: enables checkpoint saves and resume. When false, every other checkpoint key is operationally
  # inactive but still type/value-validated, and any --resume request fails even if files exist.
  enabled: true

  # Key: checkpoint.root_dir
  # Type: string | null
  # Default: null, computed as <resolved run directory>/checkpoints.
  # Required: no; used only when checkpoint.enabled is true.
  # Valid: null or a nonempty filesystem path string. Relative paths resolve under the final run
  # directory; absolute paths are used as written.
  # Use: separates checkpoint storage from other artifacts when needed. Resume must resolve the same
  # location from the run configuration.
  root_dir: null

  # Key: checkpoint.save_every
  # Type: integer
  # Default: 5000.
  # Required: no; used only when checkpoint.enabled is true.
  # Valid: > 0 when checkpointing is enabled.
  # Use: periodic save interval in optimizer steps. A final save is also attempted during clean,
  # crash, and interrupt unwinding when train/data state is aligned and metrics are finite. Smaller
  # intervals reduce lost work and add I/O.
  save_every: 5000

  # Key: checkpoint.max_to_keep
  # Type: integer
  # Default: 3.
  # Required: no; used only when checkpoint.enabled is true.
  # Valid: > 0 when checkpointing is enabled.
  # Use: number of retained checkpoints.
  # Warning: Orbax deletes older checkpoints beyond this count. Raise it if deeper rollback is needed.
  max_to_keep: 3

  # Key: checkpoint.async_save
  # Type: boolean
  # Default: true.
  # Required: no; used only when checkpoint.enabled is true.
  # Valid: true | false.
  # Use: true overlaps save I/O with training and is recommended for throughput. Clean shutdown waits
  # for outstanding saves; abrupt process termination may leave the newest asynchronous save unusable.
  async_save: true

# Key: logging
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the logging.* keys listed in this section.
# Use: controls local artifacts, console/file logging, and optional W&B reporting.
logging:
  # Key: logging.project
  # Type: string
  # Default: chomp.
  # Required: no.
  # Valid: nonempty string.
  # Use: groups automatically created run directories under runs/<project>. It is also the computed
  # W&B project when logging.wandb.project is null.
  project: chomp

  # Key: logging.run_dir
  # Type: string | null
  # Default: null, computed as runs/<logging.project>/<YYYYMMDD_HHMMSS>_<config-stem>.
  # Required: an explicit existing path is required for resume; otherwise no.
  # Valid: null or a nonempty filesystem path string.
  # Precedence: chomp train --run-dir PATH overrides this key.
  # Warning: a fresh run refuses to overwrite an existing directory. Resume immediately refuses null
  # or a nonexistent directory so it cannot silently create a different run.
  run_dir: null

  # Key: logging.metrics_file
  # Type: string
  # Default: metrics.jsonl.
  # Required: no.
  # Valid: nonempty filename or filesystem path string.
  # Use: metrics JSONL output. Relative paths resolve under the final run directory; absolute paths
  # are used as written.
  metrics_file: metrics.jsonl

  # Key: logging.level
  # Type: enum string
  # Default: INFO.
  # Required: no.
  # Valid: DEBUG | INFO | WARNING | ERROR.
  # Use: Python console and file log threshold. INFO is recommended for normal training.
  level: INFO

  # Key: logging.console_use_rich
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: enables Rich console formatting. Use false for plain machine-captured logs or incompatible
  # terminals.
  console_use_rich: true

  # Key: logging.log_file
  # Type: string | null
  # Default: train.log.
  # Required: no.
  # Valid: null or a nonempty filename/path string.
  # Use: local text log. null disables file logging; relative paths resolve under the final run
  # directory and absolute paths are used as written.
  log_file: train.log

  # Key: logging.wandb
  # Type: mapping
  # Default: omitted or {}, which applies every logging.wandb.* default below.
  # Required: no.
  # Valid: only the logging.wandb.* keys listed in this block.
  # Use: controls optional Weights & Biases telemetry.
  wandb:
    # Key: logging.wandb.enabled
    # Type: boolean
    # Default: false, so W&B does not initialize and no credentials are needed.
    # Required: no.
    # Valid: true | false.
    # Use: enables W&B for normal training. Dry runs skip W&B even when true. Online mode requires
    # valid W&B authentication and network access before training starts.
    enabled: false

    # Key: logging.wandb.project
    # Type: string | null
    # Default: null, computed as logging.project.
    # Required: no; used only when logging.wandb.enabled is true.
    # Valid: null or a nonempty W&B project string.
    # Use: remote W&B project name.
    project: null

    # Key: logging.wandb.entity
    # Type: string | null
    # Default: null, which uses the authenticated account's W&B default entity.
    # Required: no; used only when logging.wandb.enabled is true.
    # Valid: null or a nonempty W&B user/team string.
    # Use: directs the run to a specific W&B account or team.
    entity: null

    # Key: logging.wandb.run_name
    # Type: string | null
    # Default: null, computed as the final logging.run_dir basename.
    # Required: no; used only when logging.wandb.enabled is true.
    # Valid: null or a nonempty display-name string.
    # Use: W&B run display name.
    run_name: null

    # Key: logging.wandb.mode
    # Type: enum string
    # Default: online.
    # Required: no; used only when logging.wandb.enabled is true.
    # Valid: online | offline.
    # Use: online sends telemetry to W&B; offline writes a local W&B run for later syncing and does
    # not require live service connectivity.
    mode: online

    # Key: logging.wandb.tags
    # Type: list[string]
    # Default: [].
    # Required: no; used only when logging.wandb.enabled is true.
    # Valid: YAML/JSON list of nonempty strings.
    # Use: W&B run tags. Set this list in the config file; list-valued --override is unsupported.
    tags: []

# Key: debug
# Type: mapping
# Default: omitted or {}, which applies every nested default below.
# Required: no.
# Valid: only the debug.* keys listed in this section.
# Use: controls runtime correctness checks.
debug:
  # Key: debug.nan_check
  # Type: boolean
  # Default: true.
  # Required: no.
  # Valid: true | false.
  # Use: checks synchronized loss, gradient norm, and learning rate plus post-update parameters and optimizer state for NaN/Inf before periodic saves, and validates the final step even when checkpointing is disabled. Evaluation also rejects non-finite loss. Keep true; checks run at existing synchronization/save/final cadences rather than forcing a host sync on every ordinary step.
  nan_check: true

  # Key: debug.check_device_every
  # Type: integer
  # Default: 100.
  # Required: no.
  # Valid: >= 0; zero disables periodic assertions.
  # Use: optimizer-step interval for checking batch placement on the selected device. Dry runs check
  # once whenever the value is positive.
  check_device_every: 100

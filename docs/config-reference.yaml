# chomp configuration reference
#
# Reference only: the typed placeholders below intentionally make this invalid as a chomp config. Runnable scenario configs live under configs/.
# Every section and key is optional to author unless its comment says otherwise. Omission applies the literal or computed default stated on that key.
# Unknown top-level sections, duplicate explicit YAML keys, unsupported choices, and invalid field values or interactions fail before training. Standard YAML merge defaults may be overridden explicitly.

# variables -- mapping[str, value]; default: {}. Values may be nested. A full `$variables.path` reference preserves type; `{$variables.path}` and `${variables.path}` interpolate into strings. Missing or circular references fail.
variables: "<mapping[str, value]>"

# derived -- mapping; default: {}. Internal use only: resolved snapshots record computed fields here, and authored values are ignored.
derived: "<mapping>"

# model -- mapping | null; default: {}. Fields other than the shared vocabulary/dropout and DummyLM width are Megalodon-only. Every raw model field is a hard resume invariant, including backend-inactive fields.
model:
  # model.backend -- string; default: megalodon; one of: megalodon | dummy. `dummy` is a debug-only MLP using vocab_size, d_model, and dropout.
  backend: "<megalodon | dummy>"

  # model.vocab_size -- int; default: 256; > 0. Setup resolves this to round_up(max(configured value, tokenizer length), data.tokenizer.vocab_size_multiple); every special-token ID must fit the result.
  vocab_size: "<int>"

  # model.d_model -- int; default: 128; > 0 when backend=dummy; ignored by Megalodon. Keep small for smoke tests. [Debug only]
  d_model: "<int>"

  # model.dropout -- float; default: 0.0; 0 <= value < 1. Shared model dropout; effective train.deterministic=true disables it, while nonzero contributes to the null deterministic default.
  dropout: "<float>"

  # model.model_dim -- int; default: 128; > 0 and divisible by model.num_heads and model.norm_num_groups. Megalodon hidden width.
  model_dim: "<int>"

  # model.num_layers -- int; default: 2; > 0. Megalodon layer count.
  num_layers: "<int>"

  # model.num_heads -- int; default: 1; > 0; must divide model.model_dim, model.z_dim, and model.value_dim, and z_dim / num_heads must be even for RoPE.
  num_heads: "<int>"

  # model.z_dim -- int; default: 64; > 0; divisible by model.num_heads with an even quotient. Megalodon query/key width.
  z_dim: "<int>"

  # model.value_dim -- int; default: 128; > 0 and divisible by model.num_heads. Megalodon value width.
  value_dim: "<int>"

  # model.ffn_hidden_dim -- int; default: 256; > 0. Feed-forward width; the maintained recipes use roughly 2.5x to 4x model.model_dim.
  ffn_hidden_dim: "<int>"

  # model.cema_ndim -- int; default: 16; > 0. CEMA components per channel; higher values add recurrent capacity and cost.
  cema_ndim: "<int>"

  # model.chunk_size -- int; default: 128; > 0, <= train.seq_len, and must divide train.seq_len. Sets local attention chunk length unless attention_window is set, and always sets the default generation length.
  chunk_size: "<int>"

  # model.attention_window -- int | null; default: null, which keeps released chunk-local attention and cache capacity model.chunk_size. A positive value enables causal sliding-window attention and sets inference cache capacity. [Experimental]
  attention_window: "<int | null>"

  # model.norm_num_groups -- int; default: 32; > 0, smaller than model.model_dim, and must divide model.model_dim. Equality is unsupported because featurewise TimestepNorm needs an unconfigured learned prior.
  norm_num_groups: "<int>"

  # model.norm_eps -- float; default: 1e-5; > 0. Numerical-stability epsilon for Megalodon normalization.
  norm_eps: "<float>"

  # model.rope_base -- float | null; default: null, which Megalodon resolves to 10000; otherwise > 0. Change only as part of a deliberate context-scaling design.
  rope_base: "<float | null>"

  # model.swiglu -- bool; default: false. Enables SwiGLU in the Megalodon feed-forward network.
  swiglu: "<bool>"

  # model.rescale_nffn -- bool; default: false. Enables learned normalized-FFN residual rescaling; its scale uses Adam without weight decay.
  rescale_nffn: "<bool>"

  # model.scale_emb -- bool; default: false. Multiplies embeddings by sqrt(model.model_dim).
  scale_emb: "<bool>"

  # model.share_emb -- bool; default: true. Ties Megalodon input/output embeddings and requires output_size=-1 or vocab_size. DummyLM remains untied, though the flag still gates Muon embedding eligibility.
  share_emb: "<bool>"

  # model.norm_affine -- bool; default: true. Enables learned affine parameters in RMSNorm and FFN LayerNorm; TimestepNorm remains affine.
  norm_affine: "<bool>"

  # model.attention_dropout -- float; default: 0.0; 0 <= value < 1. Megalodon-only; effective train.deterministic=true disables it, while nonzero contributes to the null deterministic default.
  attention_dropout: "<float>"

  # model.attention_dropout_mode -- string; default: post_softmax; one of: post_softmax | dropkey. Used only when attention_dropout > 0; keep post_softmax unless reproducing a deliberate DropKey run.
  attention_dropout_mode: "<post_softmax | dropkey>"

  # model.hidden_dropout -- float; default: 0.0; 0 <= value < 1. Megalodon-only; effective train.deterministic=true disables it, while nonzero contributes to the null deterministic default.
  hidden_dropout: "<float>"

  # model.pad_token_id -- int; default: 0; 0 <= value < effective vocab_size. HF auto-special-token setup may replace it; equality with eos_token_id warns because external tooling may treat EOS as padding.
  pad_token_id: "<int>"

  # model.bos_token_id -- int; default: 1; 0 <= value < effective vocab_size. HF auto-special-token setup may replace it; byte BOS insertion also requires it below data.tokenizer.byte_offset.
  bos_token_id: "<int>"

  # model.eos_token_id -- int; default: 2; 0 <= value < effective vocab_size. HF auto-special-token setup may replace it; byte EOS insertion also requires it below data.tokenizer.byte_offset.
  eos_token_id: "<int>"

  # model.init_mode -- string; default: he; one of: gaussian | xavier | he | bert. Used only for fresh Megalodon initialization; restored parameters replace it, but the raw value remains a resume invariant. `he` is recommended.
  init_mode: "<gaussian | xavier | he | bert>"

  # model.use_checkpoint -- bool; default: false. Trades compute for activation memory. Effective train.deterministic=true disables it, so the full recipes set deterministic=false even with zero dropout.
  use_checkpoint: "<bool>"

  # model.output_size -- int; default: -1, computed as effective vocab_size; otherwise > 0. With share_emb=true it must be -1 or model.vocab_size; an untied Megalodon head must be at least model.vocab_size. Keep -1 for causal-LM training.
  output_size: "<-1 | positive int>"

  # model.use_associative_segment_scan -- bool; default: true. Used only for strict bin/multipack batches: true is the faster parallel CEMA reset path; false uses a compact sequential forward carry, but compiled backward-memory savings are not guaranteed. [Experimental]
  use_associative_segment_scan: "<bool>"

  # model.param_dtype -- string; default and only valid value: float32. Chomp has no FP32 master-parameter path, so lower-precision parameters and optimizer state are unsupported.
  param_dtype: "<float32>"

  # model.compute_dtype -- string; default: bfloat16; one of: float32 | bfloat16. BF16 is recommended on supported GPUs; FP16 is unsupported.
  compute_dtype: "<float32 | bfloat16>"

  # model.accum_dtype -- string; default and only valid value: float32. Controls model-internal attention/CEMA accumulation, not train.grad_accum.
  accum_dtype: "<float32>"

  # model.attention_softmax_dtype -- string; default: float32; one of: float32 | bfloat16. Keep FP32 for numerical stability; BF16 is an explicit lower-precision reduction.
  attention_softmax_dtype: "<float32 | bfloat16>"

  # model.loss_softmax_dtype -- string; default: float32; one of: float32 | bfloat16. Keep FP32 for stable causal-loss reduction.
  loss_softmax_dtype: "<float32 | bfloat16>"

  # model.loss_chunk_size -- int | null; default: null; null or > 0; Megalodon-only. A positive static value chunks vocabulary projection during train/eval loss, reducing peak memory without changing loss math but rematerializing work in backward.
  # Full-logit storage is about batch_size * seq_len * vocab_size * 4 bytes per microbatch. For memory-bound 32K-vocabulary long-context runs, start at 256 and choose the largest value that fits; null is fastest.
  loss_chunk_size: "<int | null>"

# data -- mapping | null; default: {}. Source, order, packing, tokenizer, and objective fields participate in resume compatibility according to their active semantics.
data:
  # data.backend -- string; default: hf; one of: hf | local_text. `local_text` consumes literal inline text and is debug-only.
  backend: "<hf | local_text>"

  # data.hf_dataset -- string; default: Zyphra/Zyda-2; nonempty when backend=hf. Changing repositories normally requires replacing the Zyda-specific default hf_name and hf_revision too.
  hf_dataset: "<nonempty string>"

  # data.hf_name -- string | null; default: sample-100BT; null lets Hugging Face Datasets select a repository's default configuration; ignored by local_text.
  hf_name: "<nonempty string | null>"

  # data.hf_split -- string; default: train; nonempty when backend=hf; ignored by local_text. Training split and source for a null-split content holdout.
  hf_split: "<nonempty string>"

  # data.hf_revision -- string | null; default: main. Any ref accepted by Hugging Face datasets is valid; null uses the repository default branch. While checkpoint.enabled=true, a branch/tag/null ref is resolved to its concrete commit before use; the active resolved config stores that commit here and records the original ref separately below.
  # This value belongs to hf_dataset: replace both together when changing sources.
  hf_revision: "<revision string | null>"

  # data.hf_requested_revision -- string | null; default: null. Internal snapshot field populated with the user-facing hf_revision before resolution; leave null in authored configs. Resume reuses a selected checkpoint's commit only when this request and hf_dataset still match.
  hf_requested_revision: "<revision string | null>"

  # data.hf_eval_split -- string | null; default: null. Null creates a content-hash holdout from hf_split and excludes it from training; an explicit nonempty split must differ from hf_split when evaluation is enabled.
  # Explicit-split collection follows data.shuffle; hash-holdout collection does not. Collection/schema failures never fall back to the training split.
  hf_eval_split: "<nonempty string | null>"

  # data.hf_eval_holdout_fraction -- float; default: 0.01; 0 < value < 1 for every HF config, even when inactive. Used only when hf_eval_split=null and max_eval_samples>0; 0.01 is the maintained choice.
  hf_eval_holdout_fraction: "<float>"

  # data.text_key -- string; default: text; nonempty when backend=hf; ignored by local_text. Every selected row must contain a string at this key; schema failures are not retried.
  text_key: "<nonempty string>"

  # data.shuffle -- bool; default: true; HF-only. Shuffles owned document windows for training and explicit-split eval; hash-holdout eval and generation prompts remain unshuffled. Packed-row shuffle is separate.
  shuffle: "<bool>"

  # data.shuffle_buffer_size -- int; default: 10000; > 0 when HF shuffle is active. Document-count cap per owned window; full recipes use 200000 together with the byte cap for stronger mixing.
  shuffle_buffer_size: "<int>"

  # data.shuffle_buffer_bytes -- int; default: 536870912 (512 MiB); > 0 when HF shuffle is active. UTF-8 payload cap per window; one oversized threshold-crossing document may exceed it.
  shuffle_buffer_bytes: "<int>"

  # data.seed -- int; default: 0; >= 0. Seeds active HF document and packed-row shuffles; model/dropout RNG uses train.seed.
  seed: "<int>"

  # data.repeat -- bool; default: true. Repeats training sources for step-based runs; false trains a padded usable tail and stops early at finite exhaustion.
  repeat: "<bool>"

  # data.local_text -- string; default: "Hello from chomp.\n"; nonempty when backend=local_text; ignored by HF. Literal text, not a path. For quick local smoke tests set max_eval_samples=0 and window_shuffle_tokens=0. [Debug only]
  local_text: "<nonempty string>"

  # data.packing_mode -- string; default: bin; one of: sequential | bin | multipack. Bin packing is the maintained real-training path; sequential preserves stream order and lets recurrent state cross documents while boundary loss remains masked.
  packing_mode: "<sequential | bin | multipack>"

  # data.packing_buffer_docs -- int; default: 256; > 0 in bin mode. Lookahead counts prepared chunks despite the legacy name. Training raises values below train.batch_size * train.grad_accum to that cycle size; evaluation raises values below train.batch_size. Effective changes in either active pipeline are resume-significant. Larger values trade startup memory for utilization.
  packing_buffer_docs: "<int>"

  # data.packing_max_docs_per_bin -- int | null; default: null (no cap); otherwise > 0; used only by bin/multipack. Caps prepared segments per row, not original source documents.
  packing_max_docs_per_bin: "<int | null>"

  # data.packing_group_docs -- int; default: 512; > 0 in multipack mode. Effective lookahead is max(this, cycle rows): train.batch_size * train.grad_accum for training and train.batch_size for evaluation. Effective changes in either active pipeline are resume-significant; larger groups increase memory and latency.
  packing_group_docs: "<int>"

  # data.packing_strict_segments -- bool; default: true; used only by bin/multipack and requires mask_boundary_loss=true. Keep true to isolate attention, RoPE, CEMA, and TimestepNorm; false deliberately leaks state across documents.
  packing_strict_segments: "<bool>"

  # data.mask_boundary_loss -- bool; default: true. Masks cross-document next-token targets in every packing mode and must remain true for strict bin/multipack; keep true for independent documents.
  mask_boundary_loss: "<bool>"

  # data.train_on_eos -- bool; default: true. False masks every label numerically equal to the effective EOS ID, including natural token-ID collisions; an all-masked batch fails before any optimizer/state change.
  train_on_eos: "<bool>"

  # data.window_shuffle_tokens -- int; default: 8388608; zero disables, otherwise >= train.seq_len * train.batch_size * train.grad_accum. Bounds the raw payload of the two int32 arrays; the effective window is also limited by window_shuffle_max_rows.
  # Keep enabled for domain-ordered or long-document corpora. Smoke configs disable it to avoid filling a large window before their first step.
  window_shuffle_tokens: "<int>"

  # data.window_shuffle_max_rows -- int; default: 4096; > 0 and, when window shuffling is enabled, >= train.batch_size * train.grad_accum. Bounds Python row objects and packed rows requested for each Grain window fill; effective rows are aligned down to a complete optimizer batch.
  window_shuffle_max_rows: "<int>"

  # data.grain_prefetch -- int; default: 2; >= 0; zero disables. Counts assembled batches and trades host memory for overlap with training.
  grain_prefetch: "<int>"

  # data.max_eval_samples -- int; default: 1000; >= 0; zero disables eval data. Positive values collect up to this many documents when a run starts; local_text produces repeated copies of the same text.
  max_eval_samples: "<int>"

  # data.tokenizer -- mapping | null; default: {}. Active tokenization semantics participate in resume compatibility; runtime-only loading knobs do not.
  tokenizer:
    # data.tokenizer.kind -- string; default: hf; one of: byte | hf. Byte is an offline infrastructure tokenizer and must disable special insertion unless byte_offset reserves IDs for it.
    kind: "<byte | hf>"

    # data.tokenizer.hf_name_or_path -- string | null; default: pszemraj/bytebpe-tokenizer-32k-mlm; nonempty when kind=hf. Fresh runs snapshot these assets; resume loads only the snapshot and fails if it is missing.
    hf_name_or_path: "<repository ID | local path | null>"

    # data.tokenizer.hf_use_fast -- bool; default: true; HF-only. Keep true unless the selected tokenizer has no fast implementation.
    hf_use_fast: "<bool>"

    # data.tokenizer.hf_trust_remote_code -- bool; default: false; HF-only. True executes custom Python from the tokenizer repository; enable only for reviewed, trusted code.
    hf_trust_remote_code: "<bool>"

    # data.tokenizer.vocab_size_multiple -- int; default: 128; > 0. Effective vocabulary is round_up(max(model.vocab_size, tokenizer length), this value); 128 is the maintained GPU alignment.
    vocab_size_multiple: "<int>"

    # data.tokenizer.auto_set_special_tokens -- bool; default: true; HF-only. Copies available pad/BOS/EOS IDs into model config; a missing pad is first filled from EOS when available. Enabled BOS/EOS insertion requires the corresponding tokenizer ID.
    auto_set_special_tokens: "<bool>"

    # data.tokenizer.byte_offset -- int; default: 0; >= 0; byte-only. Reserves IDs below the offset and maps bytes to offset..offset+255; model.vocab_size must cover that range, and BOS/EOS insertion requires offset > 0.
    byte_offset: "<int>"

    # data.tokenizer.add_bos -- bool; default: false. Prepends BOS after truncation and before packing, not to generation prompts. Byte mode requires bos_token_id < byte_offset; HF auto-special mode requires a tokenizer BOS ID.
    add_bos: "<bool>"

    # data.tokenizer.add_eos -- bool; default: true. Appends EOS after truncation and before packing; data.train_on_eos controls its loss. Byte mode requires eos_token_id < byte_offset; HF auto-special mode requires a tokenizer EOS ID.
    add_eos: "<bool>"

    # data.tokenizer.max_doc_tokens -- int | null; default: null (no truncation); otherwise > 0. Applied after full tokenization and before inserted specials, so it discards document tails without reducing tokenizer peak work; leave null unless intentional.
    max_doc_tokens: "<int | null>"

# train -- mapping | null; default: {}. Shape fields define one compiled optimizer step and are hard resume invariants.
train:
  # train.seed -- int; default: 0; >= 0. Seeds fresh model/dropout and periodic-generation RNGs; data order uses data.seed. Restored model RNG wins on resume, while generation RNGs restart.
  seed: "<int>"

  # train.steps -- int; default: 100; > 0 and > optim.warmup_steps. Total target step, not additional resumed work; null optim.decay_steps also derives its LR horizon from this value. Default is smoke-scale; full recipes use 100000.
  steps: "<int>"

  # train.batch_size -- int; default: 2; > 0. Packed rows per accumulation slice; contributes to packing/shuffle minima. Full recipes use 2 and scale effective batch with grad_accum.
  batch_size: "<int>"

  # train.seq_len -- int; default: 128; >= 8; for Megalodon must be >= and divisible by model.chunk_size. Default is smoke-scale; full recipes use 2048. Changing it recompiles and breaks resume.
  seq_len: "<int>"

  # train.grad_accum -- int; default: 1; > 0. Accumulation slices per optimizer step; loss is weighted by valid tokens. Full recipes use 8 with batch_size=2 and seq_len=2048.
  grad_accum: "<int>"

  # train.jit -- bool; default: true. JIT-compiles train/eval; keep true for training and use false only for focused eager debugging.
  jit: "<bool>"

  # train.deterministic -- bool | null; default: null, computed true only when every active dropout is zero. Explicit values override that rule; effective true disables model.use_checkpoint. Resume compares the effective value, so null and true are equivalent when all active dropout is zero. This controls dropout only: exact checkpoint/data restoration does not make interrupted and continuous GPU runs bit-identical when backend kernels are nondeterministic.
  deterministic: "<bool | null>"

  # train.allow_cpu -- bool; default: false. False requires GPU execution; true permits CPU or any other non-GPU/indeterminate backend rather than forcing CPU. [Debug only]
  allow_cpu: "<bool>"

  # train.log_every -- int; default: 25; > 0. Completed-step metric cadence; evaluation can force an off-cadence row, but training completion does not. Values above train.steps can leave a no-eval run with no metric rows; use 1 for smoke runs and 25 for full recipes.
  log_every: "<int>"

  # train.eval_every -- int; default: 2500; >= 0; zero disables scheduled evaluation. Evaluation also requires data.max_eval_samples > 0 and usable eval data; cadence may change on resume.
  eval_every: "<int>"

  # train.generate_every -- int; default: 5000; >= 0; zero disables. Periodic sampling runs only for non-dry Megalodon training; prompt/setup failures disable sampling, and generation RNGs restart on resume.
  generate_every: "<int>"

  # train.generate_input_len -- int | null; default: null, computed as max(1, train.seq_len // 2); otherwise 1..train.seq_len. Generation-only prompt target length.
  generate_input_len: "<int | null>"

  # train.generate_max_tokens -- int | null; default: null, computed as model.chunk_size + 16; otherwise > 0. Maximum new tokens per periodic sample.
  generate_max_tokens: "<int | null>"

  # train.generate_temperature -- float | null; default: null, which uses the installed backend default (currently 1.0); otherwise >= 0. Zero is greedy and ignores stochastic filters.
  generate_temperature: "<float | null>"

  # train.generate_top_k -- int | null; default: null (backend default); otherwise > 0. Generation-only top-k cutoff; irrelevant when temperature=0.
  generate_top_k: "<int | null>"

  # train.generate_top_p -- float | null; default: null (backend default); otherwise 0 < value <= 1. Generation-only nucleus cutoff; irrelevant when temperature=0.
  generate_top_p: "<float | null>"

  # train.profile -- bool; default: false. Enables a full-run JAX trace including first compilation; traces add overhead and can be large, so enable only for focused profiling.
  profile: "<bool>"

  # train.profile_dir -- string | null; default: null, computed as <run_dir>/trace; otherwise nonempty. Used only with profile=true; explicit relative paths resolve from the process working directory.
  profile_dir: "<nonempty string | null>"

# optim -- mapping | null; default: {}. Selects the optimizer and warmup-plus-cosine schedule; all supplied nested values are validated even when inactive. Value changes warn on default resume and are rejected by checkpoint.resume_compat=strict; optimizer-state structure changes always fail.
optim:
  # optim.name -- string; default: adamw; one of: adamw | muon. Muon handles eligible projection matrices and nested Adam handles all others; no eligible matrices falls back to AdamW with a warning. Maintained full-run recipes use Muon; AdamW is the conventional baseline.
  name: "<adamw | muon>"

  # optim.lr -- float; default: 0.0003; > 0. Peak Adam learning rate after warmup; Muon uses this schedule multiplied by optim.muon.lr_scale.
  lr: "<float>"

  # optim.weight_decay -- float; default: 0.01; >= 0; zero disables. Model-aware decay applies to embeddings/dense projections, not biases, norms/scales, attention offsets, or CEMA coefficients; Muon also applies weight_decay_mult.
  weight_decay: "<float>"

  # optim.grad_clip_norm -- float; default: 1.0; >= 0; zero disables. Global clipping occurs after valid-token normalization and before optimizer partitioning; logged grad_norm is pre-clipping. Keep 1.0 as the starting point.
  grad_clip_norm: "<float>"

  # optim.warmup_steps -- int; default: 10; >= 0 and < train.steps. Linear warmup duration; no ratio alternative exists. Maintained 100k-step recipes use 1000.
  warmup_steps: "<int>"

  # optim.decay_steps -- int | null; default: null, computed as train.steps - warmup_steps; otherwise > 0. Extending train.steps with null extends the schedule and produces a resume warning; set an explicit duration when the original horizon should remain fixed.
  decay_steps: "<int | null>"

  # optim.min_lr_ratio -- float; default: 0.0; 0 <= value <= 1. Final schedule floor divided by optim.lr; maintained 100k-step recipes use 0.1, while an explicit decay horizon may end before or after train.steps.
  min_lr_ratio: "<float>"

  # optim.muon -- mapping | null; default: {}; used only when optim.name=muon. Inactive values remain type/constraint validated.
  muon:
    # optim.muon.lr_scale -- float; default: 100.0; > 0. Multiplier from the Adam schedule to Muon matrix LR; 100 is the maintained choice and narrowly beat 150 in the repository's 10k-step sweep.
    lr_scale: "<float>"

    # optim.muon.weight_decay_mult -- float; default: 1.0; >= 0. Multiplies optim.weight_decay for Muon matrices; zero disables their decay.
    weight_decay_mult: "<float>"

    # optim.muon.momentum -- float; default: 0.95; 0 < value < 1. Muon momentum coefficient.
    momentum: "<float>"

    # optim.muon.ns_steps -- int; default: 5; > 0. Newton-Schulz iterations; more costs compute, so keep 5 unless reproducing another recipe.
    ns_steps: "<int>"

    # optim.muon.nesterov -- bool; default: true. Enables Nesterov momentum on Muon matrices.
    nesterov: "<bool>"

    # optim.muon.consistent_rms -- float | null; default and recommendation: null, which omits optional shape/RMS scaling; otherwise >= 0. Zero suppresses the Muon gradient component while decay may remain. Non-null uses a private Optax contrib helper. [Experimental]
    consistent_rms: "<float | null>"

    # optim.muon.allow_all_2d -- bool; default: false. True overrides the conservative whitelist and sends every 2D tensor, including embeddings and non-matmul CEMA/attention arrays, to Muon. [Experimental; high-risk]
    allow_all_2d: "<bool>"

    # optim.muon.allow_tied_embed -- bool; default: false. With allow_all_2d=false and model.share_emb=true, adds the embedding to Muon eligibility; for DummyLM this follows the flag even though its input/output weights are not tied. [Experimental]
    allow_tied_embed: "<bool>"

  # optim.adam -- mapping | null; default: {}. Configures every parameter under AdamW and the non-Muon partition under Muon.
  adam:
    # optim.adam.b1 -- float; default: 0.9; 0 < value < 1. Adam first-moment coefficient.
    b1: "<float>"

    # optim.adam.b2 -- float; default: 0.999; 0 < value < 1. Adam second-moment coefficient.
    b2: "<float>"

    # optim.adam.eps -- float; default: 1e-8; > 0. Adam denominator epsilon.
    eps: "<float>"

    # optim.adam.nesterov -- bool; default: false. Enables Nesterov-style Adam for every Adam-labeled parameter.
    nesterov: "<bool>"

# checkpoint -- mapping | null; default: {}. Controls Orbax save/resume behavior.
checkpoint:
  # checkpoint.enabled -- bool; default: true. False disables saves/resume and makes positive save/retention constraints inactive. Keep true for real runs.
  enabled: "<bool>"

  # checkpoint.save_every -- int; default: 5000; > 0 when enabled. Periodic optimizer-step cadence; aligned final save is separate. Maintained 100k recipes use 2500 to limit lost work.
  save_every: "<int>"

  # checkpoint.max_to_keep -- int; default: 3; > 0 when enabled. Orbax permanently deletes older checkpoints beyond this count; increase it when deeper rollback is required.
  max_to_keep: "<int>"

  # checkpoint.async_save -- bool; default: true; used only when enabled. Overlaps I/O with training and is recommended for GPU runs; graceful shutdown waits, but abrupt termination can lose the newest in-flight save.
  async_save: "<bool>"

  # checkpoint.resume_compat -- string; default: warn; one of: strict | warn. Warn mode permits intentional data, objective, schedule, and optimizer-value changes while logging each mismatch; strict rejects those changes. Parameter/optimizer-state structure mismatches always fail. Maintained long-run recipes select strict explicitly. If warn mode cannot apply saved Grain state to a changed pipeline, train state restores and data restarts from the beginning.
  resume_compat: "<strict | warn>"

# logging -- mapping | null; default: {}. Relative artifact paths resolve under the final run directory unless stated otherwise.
logging:
  # logging.project -- string; default: chomp; nonempty. Groups generated runs under runs/<project> and is the fallback W&B project.
  project: "<nonempty string>"

  # logging.run_dir -- string | null; default: null, computed as runs/<project>/<timestamp>_<config stem>; otherwise nonempty. `--run-dir` takes precedence. Fresh runs refuse existing paths; resume requires the exact existing path.
  run_dir: "<nonempty string | null>"

  # logging.metrics_file -- string; default: metrics.jsonl; nonempty. Relative paths resolve under run_dir; absolute paths are outside its lock. Writes append; never resolve this to logging.log_file or log text will corrupt JSONL.
  metrics_file: "<nonempty string>"

  # logging.level -- string; default: INFO; one of: DEBUG | INFO | WARNING | ERROR. INFO is recommended; DEBUG is for diagnosis.
  level: "<DEBUG | INFO | WARNING | ERROR>"

  # logging.console_use_rich -- bool; default: true. Rich interactive formatting; use false for plain machine-captured logs.
  console_use_rich: "<bool>"

  # logging.log_file -- string | null; default: train.log; null disables; otherwise nonempty. Relative paths resolve under run_dir; absolute paths are outside its lock. Writes append; never resolve this to metrics_file.
  log_file: "<nonempty string | null>"

  # logging.wandb -- mapping | null; default: {}. Nested values are validated even when disabled.
  wandb:
    # logging.wandb.enabled -- bool; default: false. Enables W&B only for non-dry runs; online use requires authentication. Chomp resume starts a new W&B run, and local W&B files use WANDB_DIR or ./wandb rather than logging.run_dir.
    enabled: "<bool>"

    # logging.wandb.project -- string | null; default: null, computed as logging.project; otherwise nonempty. Set only when remote grouping should differ from local grouping.
    project: "<nonempty string | null>"

    # logging.wandb.entity -- string | null; default: null, which uses the authenticated account's default entity; otherwise nonempty.
    entity: "<nonempty string | null>"

    # logging.wandb.run_name -- string | null; default: null, computed as the final run-directory basename; otherwise nonempty.
    run_name: "<nonempty string | null>"

    # logging.wandb.mode -- string; default: online; one of: online | offline. Offline writes local W&B state for later syncing without live service access.
    mode: "<online | offline>"

    # logging.wandb.tags -- list[string]; default: []; every entry nonempty. Set in YAML; scalar CLI overrides do not support lists.
    tags: "<list[nonempty string]>"

# debug -- mapping | null; default: {}. Runtime correctness checks.
debug:
  # debug.nan_check -- bool; default: true. Validates synchronized metrics and dry-run/pre-save/final parameters plus optimizer state. False permits non-finite state to be checkpointed; keep true.
  nan_check: "<bool>"
